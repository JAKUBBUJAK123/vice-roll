<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Velvet Roll — Roguelike Dice & Card Deckbuilder</title>
  <meta name="description" content="A Balatro-inspired roguelike dice-and-card deckbuilder built in a single self-contained HTML5 Canvas file with tactile pixel-vector visuals, 18 modifier cards, 5 editions, and procedural Web Audio." />
  <meta property="og:title" content="Velvet Roll — Roguelike Dice & Card Deckbuilder" />
  <meta property="og:description" content="Roll 5 dice, sculpt 3-dice scoring hands, stack 18 playing-card modifiers across 5 rare editions, and conquer a 9-stage roguelike run plus Endless Mode." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="./src/index.css"/>
</head>
<body>
<canvas id="game-canvas" aria-label="Velvet Roll Roguelike Dice and Card Deckbuilder"></canvas>
<script type="module">
import { COLORS } from './src/config/colors.js';
import { EDITIONS } from './src/config/editions.js';
import { HANDS, HAND_ORDER } from './src/config/hands.js';
import { SUIT_SYMBOLS, CARD_CATALOG, CARD_BY_ID } from './src/config/cards.js';
import {
  DICE_COUNT,
  DICE_SIDES,
  MAX_SELECT_DICE,
  DICE_LAYOUT,
  TITLE_DICE,
  getDicePipCoords,
  createFreshDice
} from './src/config/dices.js';
import {
  clamp,
  lerp,
  addShake as engineAddShake,
  spawnPopup as engineSpawnPopup,
  spawnParticles as engineSpawnParticles,
  updateGraphicsEffects,
  drawParticlesAndPopups as engineDrawParticlesAndPopups,
  drawCRTOverlay as engineDrawCRTOverlay,
  drawHitFlash,
  tracePixelRect,
  drawBevelPanel,
  drawSuitIcon,
  wrapLines,
  getSuitColor,
  drawTableBackground as engineDrawTableBackground,
  drawDie as engineDrawDie,
  drawPlayingCard as engineDrawPlayingCard
} from './src/graphicEngine.js';

(() => {
  'use strict';

  // =========================================================================
  // 1. CONSTANTS, THEME PALETTE & GAME DATA
  // =========================================================================
  const LOGICAL_W = 1280;
  const LOGICAL_H = 760;
  const BASE_MAX_SLOTS = 5;
  const BASE_HANDS = 4;
  const BASE_REROLLS = 3;
  const SHOP_REROLL_COST = 3;
  const MAX_INTEREST = 5;
  const STORAGE_KEY = 'velvet_roll_stats_v1';

  const STAGE_TARGETS = [
    300, 800, 2000,
    4500, 10000, 22000,
    48000, 105000, 240000
  ];

  const BOSS_MODIFIERS = [
    {
      id: 'EVEN_ZERO',
      name: 'The Even Drain',
      short: 'Even dice give 0 Chips',
      desc: 'All even dice (2, 4, 6) contribute 0 pip Chips when scored.'
    },
    {
      id: 'TWO_REROLLS',
      name: 'The Tight Grip',
      short: 'Only 2 Rerolls allowed',
      desc: 'Start this stage with 2 Rerolls instead of 3.'
    },
    {
      id: 'ODD_ZERO',
      name: 'The Odd Tax',
      short: 'Odd dice give 0 Chips',
      desc: 'All odd dice (1, 3, 5) contribute 0 pip Chips when scored.'
    },
    {
      id: 'DISABLE_FIRST',
      name: 'The Blind Eye',
      short: 'First card slot disabled',
      desc: 'Your leftmost modifier card is debuffed. Reorder cards to adapt!'
    },
    {
      id: 'THREE_HANDS',
      name: 'The Short Stack',
      short: 'Only 3 Hands allowed',
      desc: 'Start this stage with 3 Hands instead of 4.'
    },
    {
      id: 'MIN_TWO_DICE',
      name: 'The Heavy Felt',
      short: 'Must play at least 2 dice',
      desc: 'Single-die hands are blocked; select 2 or 3 dice to score.'
    }
  ];

  // =========================================================================
  // 2. PROCEDURAL WEB AUDIO API SYNTHESIZER
  // =========================================================================
  class SoundEngine {
    constructor() {
      this.ctx = null;
      this.muted = false;
      this.noiseBuf = null;
    }

    unlock() {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        const len = Math.floor(this.ctx.sampleRate * 0.25);
        this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const data = this.noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume().catch(() => {});
      }
    }

    tone(freq, dur, type = 'triangle', gainVal = 0.14, delay = 0, freqEnd = null) {
      if (this.muted) return;
      this.unlock();
      if (!this.ctx) return;
      const now = this.ctx.currentTime + delay;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      if (freqEnd !== null) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), now + dur);
      }
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(gainVal, now + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + dur + 0.02);
    }

    noise(dur, filterFreq = 1200, q = 2.0, gainVal = 0.12, delay = 0) {
      if (this.muted) return;
      this.unlock();
      if (!this.ctx || !this.noiseBuf) return;
      const now = this.ctx.currentTime + delay;
      const src = this.ctx.createBufferSource();
      src.buffer = this.noiseBuf;
      const filt = this.ctx.createBiquadFilter();
      filt.type = 'bandpass';
      filt.frequency.setValueAtTime(filterFreq, now);
      filt.Q.setValueAtTime(q, now);
      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(gainVal, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      src.connect(filt);
      filt.connect(gain);
      gain.connect(this.ctx.destination);
      src.start(now);
      src.stop(now + dur + 0.02);
    }

    click() {
      this.tone(520, 0.045, 'triangle', 0.08, 0, 320);
    }

    dieSelect(selected) {
      if (selected) {
        this.tone(390, 0.075, 'triangle', 0.12, 0, 620);
      } else {
        this.tone(360, 0.075, 'triangle', 0.09, 0, 220);
      }
    }

    diceRoll(count = 5) {
      const hits = Math.min(8, Math.max(3, count + 2));
      for (let i = 0; i < hits; i++) {
        const d = i * 0.05 + Math.random() * 0.025;
        const f = 750 + Math.random() * 900;
        this.noise(0.045, f, 3.2, 0.11 - i * 0.008, d);
        this.tone(210 + Math.random() * 140, 0.04, 'triangle', 0.07, d, 110);
      }
    }

    cardSnap() {
      this.noise(0.04, 1900, 1.8, 0.09, 0);
      this.tone(440, 0.06, 'sine', 0.08, 0, 580);
    }

    buyCard() {
      this.tone(660, 0.09, 'triangle', 0.13, 0);
      this.tone(880, 0.12, 'triangle', 0.13, 0.065);
      this.tone(1320, 0.18, 'sine', 0.11, 0.12);
    }

    sellCard() {
      this.tone(1180, 0.08, 'sine', 0.12, 0);
      this.tone(1560, 0.14, 'triangle', 0.11, 0.055);
    }

    error() {
      this.tone(155, 0.14, 'sawtooth', 0.08, 0, 115);
    }

    scoreStep(stepIdx, kind) {
      // Escalating pentatonic pitch ladder
      const semis = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28, 31, 33, 36];
      const semi = semis[Math.min(semis.length - 1, stepIdx)];
      const baseFreq = 392 * Math.pow(2, semi / 12);

      if (kind === 'chips') {
        this.tone(baseFreq, 0.13, 'triangle', 0.13, 0);
        this.tone(baseFreq * 2, 0.09, 'sine', 0.06, 0.015);
      } else if (kind === 'mult') {
        this.tone(baseFreq * 0.9, 0.16, 'sawtooth', 0.07, 0);
        this.tone(baseFreq * 1.25, 0.16, 'triangle', 0.12, 0.01);
      } else if (kind === 'xmult') {
        this.tone(baseFreq, 0.22, 'sawtooth', 0.08, 0, baseFreq * 1.15);
        this.tone(baseFreq * 1.5, 0.24, 'triangle', 0.14, 0.02);
        this.tone(baseFreq * 2, 0.26, 'sine', 0.10, 0.04);
      } else if (kind === 'money') {
        this.tone(1318, 0.09, 'sine', 0.11, 0);
        this.tone(1760, 0.14, 'triangle', 0.11, 0.055);
      } else if (kind === 'retrigger') {
        this.tone(540, 0.06, 'square', 0.06, 0, 720);
        this.tone(720, 0.07, 'triangle', 0.09, 0.045);
      } else if (kind === 'debuff') {
        this.tone(140, 0.16, 'sawtooth', 0.09, 0, 95);
      } else {
        this.tone(baseFreq, 0.12, 'triangle', 0.11, 0);
      }
    }

    totalSlam(beatTarget) {
      this.tone(110, 0.28, 'sine', 0.22, 0, 48);
      this.noise(0.11, 420, 1.2, 0.14, 0);
      if (beatTarget) {
        const chord = [523.25, 659.25, 783.99, 1046.5];
        chord.forEach((f, i) => {
          this.tone(f, 0.34, 'triangle', 0.12, 0.05 + i * 0.055);
        });
      } else {
        this.tone(330, 0.16, 'triangle', 0.12, 0.04, 392);
      }
    }

    scoreTick() {
      this.tone(780 + Math.random() * 140, 0.025, 'sine', 0.04, 0);
    }

    bossIntro() {
      this.tone(130.81, 0.45, 'sawtooth', 0.09, 0, 123.47);
      this.tone(155.56, 0.45, 'triangle', 0.10, 0.08);
      this.tone(196.0, 0.55, 'sawtooth', 0.08, 0.16, 185.0);
    }

    victory() {
      const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98];
      notes.forEach((f, i) => {
        this.tone(f, 0.42, 'triangle', 0.12, i * 0.08);
        this.tone(f * 0.5, 0.36, 'sine', 0.07, i * 0.08);
      });
    }

    gameOver() {
      const notes = [392.0, 349.23, 311.13, 261.63];
      notes.forEach((f, i) => {
        this.tone(f, 0.35, 'sawtooth', 0.07, i * 0.12, f * 0.94);
      });
    }
  }

  const sfx = new SoundEngine();

  // =========================================================================
  // 3. HELPER FUNCTIONS (HAND EVAL, EDITIONS, PERSISTENCE, DRAWING)
  // =========================================================================
  let nextUid = 1;

  function loadStats() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        return {
          bestHand: Number(parsed.bestHand) || 0,
          bestStage: Number(parsed.bestStage) || 0,
          wins: Number(parsed.wins) || 0
        };
      }
    } catch (_) {}
    return { bestHand: 0, bestStage: 0, wins: 0 };
  }

  function saveStats(stats) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(stats));
    } catch (_) {}
  }

  function getStageTarget(stage) {
    if (stage <= STAGE_TARGETS.length) return STAGE_TARGETS[stage - 1];
    let v = STAGE_TARGETS[STAGE_TARGETS.length - 1];
    for (let s = STAGE_TARGETS.length + 1; s <= stage; s++) {
      v = Math.round((v * 2.25) / 100) * 100;
    }
    return v;
  }

  function getStageLabel(stage) {
    if (stage % 3 === 0) return 'BOSS BLIND';
    if (stage % 3 === 2) return 'BIG BLIND';
    return 'SMALL BLIND';
  }

  function getStageBaseReward(stage) {
    if (stage % 3 === 0) return 6;
    if (stage % 3 === 2) return 4;
    return 3;
  }

  function evaluateHand(diceValues) {
    if (!diceValues || diceValues.length === 0) return null;
    const sorted = [...diceValues].sort((a, b) => a - b);
    const counts = {};
    for (const v of sorted) counts[v] = (counts[v] || 0) + 1;
    const freqs = Object.values(counts).sort((a, b) => b - a);

    if (sorted.length === 3 && sorted[0] === 6 && sorted[1] === 6 && sorted[2] === 6) {
      return HANDS.PERFECT_18;
    }
    if (freqs[0] >= 3) {
      return HANDS.THREE_OF_A_KIND;
    }
    if (sorted.length === 3 && sorted[1] === sorted[0] + 1 && sorted[2] === sorted[1] + 1) {
      return HANDS.SMALL_STRAIGHT;
    }
    if (freqs[0] >= 2) {
      return HANDS.PAIR;
    }
    return HANDS.HIGH_DIE;
  }

  function rollEdition() {
    const r = Math.random() * 100;
    if (r < 80) return 'standard';
    if (r < 88) return 'foil';
    if (r < 95) return 'holographic';
    if (r < 98) return 'polychrome';
    return 'negative';
  }

  function createCardInstance(cardId, forcedEdition = null) {
    const def = CARD_BY_ID[cardId];
    const edition = forcedEdition || rollEdition();
    const edDef = EDITIONS[edition];
    const rawPrice = def.basePrice + edDef.priceAdd;
    const price = Math.max(4, Math.min(8, rawPrice));
    const sellValue = Math.max(2, Math.floor(price / 2));
    return {
      uid: nextUid++,
      cardId: def.id,
      edition,
      price,
      sellValue,
      scalingBonus: 0,
      // Visual state
      x: 0, y: 0,
      targetX: 0, targetY: 0,
      scale: 1,
      bounce: 0,
      tilt: 0,
      flash: 0,
      pulseColor: '#FFFFFF'
    };
  }

  function fmtNum(n) { return Math.round(n).toLocaleString('en-US'); }
  function fmtMult(n) {
    const r = Math.round(n * 10) / 10;
    return Number.isInteger(r) ? String(r) : r.toFixed(1);
  }
  function hitTest(px, py, rect) {
    return rect && px >= rect.x && px <= rect.x + rect.w && py >= rect.y && py <= rect.y + rect.h;
  }

  // =========================================================================
  // 4. GAME STATE & ENGINE
  // =========================================================================
  const canvas = document.getElementById('game-canvas');
  const ctx = canvas.getContext('2d');

  const state = {
    mode: 'TITLE_MENU', // TITLE_MENU | PLAYING | SCORING | CASH_OUT | SHOP | VICTORY | GAME_OVER
    modal: null,        // null | 'PAUSE' | 'GUIDE'
    crtEnabled: true,
    time: 0,
    stats: loadStats(),

    // Viewport transform
    vw: window.innerWidth,
    vh: window.innerHeight,
    dpr: Math.min(window.devicePixelRatio || 1, 2),
    scale: 1,
    ox: 0,
    oy: 0,

    // Run state
    stage: 1,
    endless: false,
    targetScore: 300,
    stageScore: 0,
    displayScore: 0,
    handsLeft: BASE_HANDS,
    rerollsLeft: BASE_REROLLS,
    money: 4,
    activeBoss: null,
    usedBossIds: [],
    bestHandScore: 0,
    totalMoneyEarned: 0,
    handsPlayedRun: 0,

    // Live scoring display
    chips: 0,
    mult: 0,
    liveHandName: '',
    scoringHandTotal: 0,
    scoringBanner: '',
    scoringQueue: [],
    scoringTimer: 0,
    scoringStepCount: 0,
    pendingAfterScore: null,

    // Dice (5 d6)
    dice: [],

    // Cards
    activeCards: [],
    shopCards: [],
    cashOutData: null,
    cashOutReveal: 0,

    // Title backdrop props
    titleDice: [],
    titleCards: [],

    // Interaction state
    mouseX: -999,
    mouseY: -999,
    hoveredCard: null, // { zone: 'active' | 'shop', card, idx, rect }
    focusedActiveUid: null,
    drag: null, // { card, fromIdx, startX, startY, curX, curY, active }
    buttons: [], // Interactive buttons rebuilt each frame for exact hit-testing
    hoverButtonId: null,
    noticeText: '',
    noticeTimer: 0,

    // Juice (particles, popups, screen shake, flash)
    particles: [],
    popups: [],
    shakeMag: 0,
    hitFlash: 0,
    scoreTickAccum: 0
  };

  function getMaxCardSlots() {
    let negs = 0;
    for (const c of state.activeCards) {
      if (c.edition === 'negative') negs++;
    }
    return BASE_MAX_SLOTS + negs;
  }

  function getUsedCardSlots() {
    let count = 0;
    for (const c of state.activeCards) {
      if (c.edition !== 'negative') count++;
    }
    return count;
  }

  function showNotice(text, dur = 1.6) {
    state.noticeText = text;
    state.noticeTimer = dur;
  }

  function addShake(amount) {
    engineAddShake(state, amount);
  }

  function spawnPopup(x, y, text, color = '#FFFFFF', size = 22) {
    engineSpawnPopup(state, x, y, text, color, size);
  }

  function spawnParticles(x, y, count, palette, speedMin = 80, speedMax = 300) {
    engineSpawnParticles(state, x, y, count, palette, speedMin, speedMax);
  }

  // Initialize decorative animated props for the Title Screen
  function initTitleBackdrop() {
    state.titleDice = TITLE_DICE.map(d => ({ ...d }));
    state.titleCards = [
      createCardInstance('KS', 'foil'),
      createCardInstance('AH', 'holographic'),
      createCardInstance('KD', 'polychrome'),
      createCardInstance('QH', 'negative'),
      createCardInstance('7D', 'standard')
    ];
  }

  // =========================================================================
  // 5. RUN & STAGE FLOW LOGIC
  // =========================================================================
  function startNewRun() {
    sfx.unlock();
    sfx.buyCard();
    state.stage = 1;
    state.endless = false;
    state.money = 4;
    state.activeCards = [];
    state.shopCards = [];
    state.usedBossIds = [];
    state.bestHandScore = 0;
    state.totalMoneyEarned = 0;
    state.handsPlayedRun = 0;
    state.modal = null;
    state.focusedActiveUid = null;
    state.drag = null;
    startStage(1);
  }

  function startStage(stageNum) {
    state.stage = stageNum;
    state.targetScore = getStageTarget(stageNum);
    state.stageScore = 0;
    state.displayScore = 0;
    state.scoringHandTotal = 0;
    state.scoringQueue = [];
    state.scoringBanner = '';
    state.mode = 'PLAYING';
    state.modal = null;
    state.focusedActiveUid = null;

    // Assign Boss every 3rd stage
    if (stageNum % 3 === 0) {
      let pool = BOSS_MODIFIERS.filter(b => !state.usedBossIds.includes(b.id));
      if (pool.length === 0) {
        state.usedBossIds = [];
        pool = BOSS_MODIFIERS;
      }
      const boss = pool[Math.floor(Math.random() * pool.length)];
      state.activeBoss = boss;
      state.usedBossIds.push(boss.id);
      sfx.bossIntro();
      showNotice('BOSS BLIND: ' + boss.name + ' — ' + boss.short, 2.8);
    } else {
      state.activeBoss = null;
    }

    state.handsLeft = (state.activeBoss && state.activeBoss.id === 'THREE_HANDS') ? 3 : BASE_HANDS;
    state.rerollsLeft = (state.activeBoss && state.activeBoss.id === 'TWO_REROLLS') ? 2 : BASE_REROLLS;

    state.dice = createFreshDice();
    sfx.diceRoll(5);
    updateLivePreview();
  }

  function rollDiceSet(indicesToRoll) {
    if (indicesToRoll.length === 0) return;
    sfx.diceRoll(indicesToRoll.length);
    for (let k = 0; k < indicesToRoll.length; k++) {
      const d = state.dice[indicesToRoll[k]];
      d.value = 1 + Math.floor(Math.random() * 6);
      d.y = d.targetY - 90 - Math.random() * 45;
      d.vy = -120 - Math.random() * 80;
      d.angle = (Math.random() - 0.5) * 1.6;
      d.vAngle = (Math.random() > 0.5 ? 1 : -1) * (10 + Math.random() * 9);
      d.tumbleTimer = 0.36 + k * 0.05;
      d.flickerTimer = 0;
      d.scale = 1.12;
      spawnParticles(d.x, d.targetY + 25, 5, ['rgba(247,243,232,0.7)', COLORS.brassBright], 40, 110);
    }
    updateLivePreview();
  }

  function isAnyDieTumbling() {
    return state.dice.some(d => d.tumbleTimer > 0.02);
  }

  function toggleDieSelection(idx) {
    if (state.mode !== 'PLAYING' || state.modal) return;
    const d = state.dice[idx];
    if (!d) return;
    if (d.selected) {
      d.selected = false;
      d.scale = 0.92;
      sfx.dieSelect(false);
    } else {
      const curSelected = state.dice.filter(x => x.selected).length;
      if (curSelected >= MAX_SELECT_DICE) {
        sfx.error();
        showNotice('Maximum 3 dice per hand — deselect one first', 1.4);
        d.scale = 0.9;
        return;
      }
      d.selected = true;
      d.scale = 1.12;
      sfx.dieSelect(true);
    }
    updateLivePreview();
  }

  function clearSelectedDice() {
    if (state.mode !== 'PLAYING' || state.modal) return;
    let changed = false;
    for (const d of state.dice) {
      if (d.selected) {
        d.selected = false;
        changed = true;
      }
    }
    if (changed) {
      sfx.dieSelect(false);
      updateLivePreview();
    }
  }

  function triggerReroll() {
    if (state.mode !== 'PLAYING' || state.modal || isAnyDieTumbling()) return;
    if (state.rerollsLeft <= 0) {
      sfx.error();
      showNotice('No Rerolls remaining this stage', 1.4);
      return;
    }
    const unselected = [];
    for (let i = 0; i < state.dice.length; i++) {
      if (!state.dice[i].selected) unselected.push(i);
    }
    if (unselected.length === 0) {
      sfx.error();
      showNotice('Deselect at least one die to reroll', 1.4);
      return;
    }
    state.rerollsLeft--;
    rollDiceSet(unselected);
  }

  function updateLivePreview() {
    if (state.mode === 'SCORING') return;
    const selected = state.dice.filter(d => d.selected);
    if (selected.length === 0) {
      state.liveHandName = '';
      state.chips = 0;
      state.mult = 0;
      return;
    }
    const hand = evaluateHand(selected.map(d => d.value));
    state.liveHandName = hand.name;
    state.chips = hand.chips;
    state.mult = hand.mult;
  }

  // =========================================================================
  // 6. DETERMINISTIC SCORING PIPELINE (LEFT-TO-RIGHT CASCADE)
  // =========================================================================
  function isDieDebuffedByBoss(val) {
    if (!state.activeBoss) return false;
    if (state.activeBoss.id === 'EVEN_ZERO' && val % 2 === 0) return true;
    if (state.activeBoss.id === 'ODD_ZERO' && val % 2 === 1) return true;
    return false;
  }

  function isCardDebuffedByBoss(cardIndex) {
    return Boolean(state.activeBoss && state.activeBoss.id === 'DISABLE_FIRST' && cardIndex === 0);
  }

  function playSelectedHand() {
    if (state.mode !== 'PLAYING' || state.modal || isAnyDieTumbling()) return;
    const playedDice = state.dice.filter(d => d.selected);
    if (playedDice.length === 0) {
      sfx.error();
      showNotice('Select 1 to 3 dice to play a hand', 1.5);
      return;
    }
    if (state.activeBoss && state.activeBoss.id === 'MIN_TWO_DICE' && playedDice.length < 2) {
      sfx.error();
      showNotice('The Heavy Felt requires at least 2 dice!', 1.8);
      return;
    }

    const hand = evaluateHand(playedDice.map(d => d.value));
    state.handsLeft--;
    state.handsPlayedRun++;
    state.mode = 'SCORING';
    state.focusedActiveUid = null;
    state.drag = null;

    // Build deterministic scoring step timeline
    const steps = [];
    const playedSum = playedDice.reduce((acc, d) => acc + d.value, 0);
    const unplayedCount = state.dice.length - playedDice.length;

    // Step 0: Base hand ignition
    steps.push({
      type: 'BASE_HAND',
      hand,
      duration: 0.42
    });

    // Determine active retrigger cards (ignoring boss-debuffed slot 0)
    const retriggerFirstCards = [];
    const retriggerSixCards = [];
    state.activeCards.forEach((inst, idx) => {
      if (isCardDebuffedByBoss(idx)) return;
      const def = CARD_BY_ID[inst.cardId];
      if (def.retriggerFirst) retriggerFirstCards.push(inst);
      if (def.retriggerSix) retriggerSixCards.push(inst);
    });

    // Step 1: Score each played die (+ any retriggers)
    const scoredDiceLog = [];
    playedDice.forEach((die, idx) => {
      const debuffed = isDieDebuffedByBoss(die.value);
      scoredDiceLog.push(die);
      steps.push({
        type: 'DIE_SCORE',
        die,
        debuffed,
        retriggerCard: null,
        duration: 0.28
      });

      // Retrigger first die via Jack of Clubs
      if (idx === 0) {
        for (const rc of retriggerFirstCards) {
          scoredDiceLog.push(die);
          steps.push({
            type: 'DIE_SCORE',
            die,
            debuffed,
            retriggerCard: rc,
            duration: 0.34
          });
        }
      }
      // Retrigger 6s via 6 of Spades
      if (die.value === 6) {
        for (const rc of retriggerSixCards) {
          scoredDiceLog.push(die);
          steps.push({
            type: 'DIE_SCORE',
            die,
            debuffed,
            retriggerCard: rc,
            duration: 0.34
          });
        }
      }
    });

    // Step 2: Modifier cards left to right
    const evalCtx = {
      hand,
      playedDice,
      scoredDice: scoredDiceLog,
      playedSum,
      unplayedCount,
      rerollsLeft: state.rerollsLeft,
      handsLeftAfterPlay: state.handsLeft,
      money: state.money
    };

    state.activeCards.forEach((inst, idx) => {
      const def = CARD_BY_ID[inst.cardId];
      if (isCardDebuffedByBoss(idx)) {
        steps.push({
          type: 'CARD_DEBUFFED',
          card: inst,
          duration: 0.30
        });
        return;
      }

      const cardEvents = def.evaluate(inst, evalCtx);
      for (const ev of cardEvents) {
        steps.push({
          type: 'CARD_EVENT',
          card: inst,
          def,
          ev,
          duration: cardEvents.length > 2 ? 0.25 : 0.34
        });
      }

      // Edition scoring trigger (Foil, Holographic, Polychrome)
      if (inst.edition === 'foil') {
        steps.push({
          type: 'EDITION_EVENT',
          card: inst,
          edition: 'foil',
          chipsAdd: 50,
          label: 'Foil +50',
          color: COLORS.chipsLight,
          sfx: 'chips',
          duration: 0.30
        });
      } else if (inst.edition === 'holographic') {
        steps.push({
          type: 'EDITION_EVENT',
          card: inst,
          edition: 'holographic',
          multAdd: 12,
          label: 'Holo +12M',
          color: '#F472B6',
          sfx: 'mult',
          duration: 0.30
        });
      } else if (inst.edition === 'polychrome') {
        steps.push({
          type: 'EDITION_EVENT',
          card: inst,
          edition: 'polychrome',
          multMul: 1.5,
          label: 'Poly x1.5',
          color: '#C084FC',
          sfx: 'xmult',
          duration: 0.34
        });
      }
    });

    // Step 3: Slam total into stage score
    steps.push({
      type: 'TOTAL_SLAM',
      duration: 0.95
    });

    state.scoringQueue = steps;
    state.scoringTimer = 0.05;
    state.scoringStepCount = 0;
    state.scoringHandTotal = 0;
    state.liveHandName = hand.name;
    state.chips = hand.chips;
    state.mult = hand.mult;
  }

  function executeScoringStep(step) {
    if (step.type === 'BASE_HAND') {
      state.chips = step.hand.chips;
      state.mult = step.hand.mult;
      state.scoringBanner = step.hand.name + '  (' + step.hand.chips + ' × ' + step.hand.mult + ')';
      sfx.scoreStep(0, 'chips');
      spawnPopup(168, 355, step.hand.name + '!', COLORS.brassBright, 20);
      return;
    }

    if (step.type === 'DIE_SCORE') {
      const d = step.die;
      d.hop = 1;
      if (step.retriggerCard) {
        step.retriggerCard.bounce = 1;
        step.retriggerCard.flash = 1;
        step.retriggerCard.pulseColor = COLORS.goldLight;
        spawnPopup(step.retriggerCard.x, step.retriggerCard.y - 36, 'Retrigger!', COLORS.goldLight, 18);
        sfx.scoreStep(state.scoringStepCount, 'retrigger');
      }
      if (step.debuffed) {
        d.flash = 1;
        d.flashColor = COLORS.multRed;
        state.scoringBanner = state.activeBoss.name + ' blocked ' + d.value + '!';
        spawnPopup(d.x, d.y - 68, '0 (Boss)', COLORS.multLight, 20);
        sfx.scoreStep(state.scoringStepCount, 'debuff');
      } else {
        state.chips += d.value;
        d.flash = 1;
        d.flashColor = COLORS.chipsLight;
        state.scoringStepCount++;
        state.scoringBanner = 'Die ' + d.value + '  →  +' + d.value + ' Chips';
        spawnPopup(d.x, d.y - 68, '+' + d.value, COLORS.chipsLight, 24);
        spawnParticles(d.x, d.y - 10, 8, [COLORS.chipsLight, '#FFFFFF'], 50, 140);
        sfx.scoreStep(state.scoringStepCount, 'chips');
      }
      return;
    }

    if (step.type === 'CARD_DEBUFFED') {
      const c = step.card;
      c.bounce = 0.6;
      c.flash = 1;
      c.pulseColor = COLORS.multRed;
      state.scoringBanner = 'Leftmost card disabled by ' + state.activeBoss.name;
      spawnPopup(c.x, c.y + 42, 'Debuffed', COLORS.multLight, 19);
      sfx.scoreStep(state.scoringStepCount, 'debuff');
      return;
    }

    if (step.type === 'CARD_EVENT') {
      const c = step.card;
      const ev = step.ev;
      c.bounce = 1;
      c.flash = 1;
      c.pulseColor = ev.color;
      state.scoringStepCount++;

      if (ev.dieId !== undefined) {
        const d = state.dice[ev.dieId];
        if (d) {
          d.hop = 0.7;
          d.flash = 0.8;
          d.flashColor = ev.color;
        }
      }
      if (ev.scaleAdd) {
        c.scalingBonus = (c.scalingBonus || 0) + ev.scaleAdd;
      }
      if (ev.chipsAdd) state.chips += ev.chipsAdd;
      if (ev.multAdd) state.mult += ev.multAdd;
      if (ev.multMul) state.mult = Math.round(state.mult * ev.multMul * 100) / 100;
      if (ev.moneyAdd) {
        state.money += ev.moneyAdd;
        state.totalMoneyEarned += ev.moneyAdd;
      }

      state.scoringBanner = step.def.name + '  →  ' + ev.label;
      spawnPopup(c.x, c.y + 45, ev.label, ev.color, ev.multMul ? 26 : 22);
      spawnParticles(c.x, c.y, ev.multMul ? 18 : 10, [ev.color, '#FFFFFF', COLORS.brassBright], 70, 210);
      if (ev.multMul) addShake(5);
      sfx.scoreStep(state.scoringStepCount, ev.sfx || 'mult');
      return;
    }

    if (step.type === 'EDITION_EVENT') {
      const c = step.card;
      c.bounce = 1.15;
      c.flash = 1;
      c.pulseColor = step.color;
      state.scoringStepCount++;
      if (step.chipsAdd) state.chips += step.chipsAdd;
      if (step.multAdd) state.mult += step.multAdd;
      if (step.multMul) state.mult = Math.round(state.mult * step.multMul * 100) / 100;

      state.scoringBanner = EDITIONS[step.edition].name + ' Edition  →  ' + step.label;
      spawnPopup(c.x, c.y + 58, step.label, step.color, 23);
      spawnParticles(c.x, c.y, 16, [step.color, '#FFFFFF', '#FDE047'], 80, 230);
      if (step.multMul) addShake(6);
      sfx.scoreStep(state.scoringStepCount, step.sfx);
      return;
    }

    if (step.type === 'TOTAL_SLAM') {
      const handTotal = Math.round(state.chips * state.mult);
      state.scoringHandTotal = handTotal;
      const prevScore = state.stageScore;
      state.stageScore += handTotal;
      if (handTotal > state.bestHandScore) state.bestHandScore = handTotal;

      // Persist best stats
      if (handTotal > state.stats.bestHand) {
        state.stats.bestHand = handTotal;
        saveStats(state.stats);
      }

      const beatTarget = state.stageScore >= state.targetScore;
      const hugeBlowout = handTotal >= state.targetScore;

      state.scoringBanner = fmtNum(state.chips) + ' × ' + fmtMult(state.mult) + ' = ' + fmtNum(handTotal) + (beatTarget ? '  —  BLIND CLEARED!' : '');
      spawnPopup(796, 390, '+' + fmtNum(handTotal), beatTarget ? COLORS.goldLight : '#FFFFFF', hugeBlowout ? 44 : 34);

      if (beatTarget) {
        addShake(hugeBlowout ? 18 : 11);
        state.hitFlash = hugeBlowout ? 0.55 : 0.3;
        spawnParticles(796, 420, hugeBlowout ? 75 : 45, [COLORS.goldLight, COLORS.emerald, COLORS.chipsLight, '#FFFFFF'], 120, 420);
        spawnParticles(168, 224, 30, [COLORS.goldLight, COLORS.emerald], 80, 260);
      } else {
        addShake(4);
        spawnParticles(796, 420, 18, [COLORS.chipsLight, COLORS.multLight, '#FFFFFF'], 80, 200);
      }
      sfx.totalSlam(beatTarget);

      // Decide next phase once slam settles
      if (beatTarget) {
        if (state.stage > state.stats.bestStage) {
          state.stats.bestStage = state.stage;
          saveStats(state.stats);
        }
        state.pendingAfterScore = 'CASH_OUT';
      } else if (state.handsLeft <= 0) {
        state.pendingAfterScore = 'GAME_OVER';
      } else {
        state.pendingAfterScore = 'NEXT_HAND';
      }
    }
  }

  function finishScoringPhase() {
    const next = state.pendingAfterScore;
    state.pendingAfterScore = null;
    state.scoringBanner = '';

    if (next === 'CASH_OUT') {
      const baseReward = getStageBaseReward(state.stage);
      const handsBonus = state.handsLeft;
      const interest = Math.min(MAX_INTEREST, Math.floor(state.money / 5));
      const total = baseReward + handsBonus + interest;
      state.cashOutData = {
        baseReward,
        handsBonus,
        handsCount: state.handsLeft,
        interest,
        total,
        claimed: false,
        isRunVictory: state.stage === 9 && !state.endless
      };
      state.cashOutReveal = 0;
      state.mode = 'CASH_OUT';
      sfx.sellCard();
    } else if (next === 'GAME_OVER') {
      state.mode = 'GAME_OVER';
      sfx.gameOver();
    } else {
      state.mode = 'PLAYING';
      // Deselect all and roll fresh 5 dice
      for (const d of state.dice) d.selected = false;
      rollDiceSet([0, 1, 2, 3, 4]);
    }
  }

  // =========================================================================
  // 7. CASH-OUT, SHOP & CARD MANAGEMENT
  // =========================================================================
  function claimCashOut() {
    if (state.mode !== 'CASH_OUT' || !state.cashOutData) return;
    if (!state.cashOutData.claimed) {
      state.cashOutData.claimed = true;
      state.money += state.cashOutData.total;
      state.totalMoneyEarned += state.cashOutData.total;
      sfx.buyCard();
      spawnPopup(168, 540, '+$' + state.cashOutData.total, COLORS.goldLight, 26);
    }

    if (state.cashOutData.isRunVictory) {
      state.stats.wins = (state.stats.wins || 0) + 1;
      state.stats.bestStage = Math.max(state.stats.bestStage, 9);
      saveStats(state.stats);
      state.mode = 'VICTORY';
      sfx.victory();
      spawnParticles(640, 320, 80, [COLORS.goldLight, COLORS.emerald, COLORS.chipsLight, '#F472B6'], 120, 420);
      return;
    }

    enterShop();
  }

  function enterShop() {
    state.mode = 'SHOP';
    state.focusedActiveUid = null;
    rollShopInventory();
  }

  function rollShopInventory() {
    const ownedIds = new Set(state.activeCards.map(c => c.cardId));
    let pool = CARD_CATALOG.filter(c => !ownedIds.has(c.id));
    if (pool.length < 3) pool = [...CARD_CATALOG];

    // Fisher-Yates shuffle
    const shuffled = [...pool];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }

    state.shopCards = shuffled.slice(0, 3).map(def => createCardInstance(def.id));
    sfx.cardSnap();
  }

  function rerollShop() {
    if (state.mode !== 'SHOP' || state.modal) return;
    if (state.money < SHOP_REROLL_COST) {
      sfx.error();
      showNotice('Need $' + SHOP_REROLL_COST + ' to reroll the Shop', 1.4);
      return;
    }
    state.money -= SHOP_REROLL_COST;
    spawnPopup(168, 540, '-$' + SHOP_REROLL_COST, COLORS.multLight, 22);
    rollShopInventory();
  }

  function buyShopCard(shopIdx) {
    if (state.mode !== 'SHOP' || state.modal) return;
    const card = state.shopCards[shopIdx];
    if (!card) return;
    if (state.money < card.price) {
      sfx.error();
      showNotice('Not enough money ($' + card.price + ' required)', 1.4);
      return;
    }
    const isNeg = card.edition === 'negative';
    if (!isNeg && state.activeCards.length >= getMaxCardSlots()) {
      sfx.error();
      showNotice('Card slots full — sell a card first!', 1.6);
      return;
    }

    state.money -= card.price;
    state.shopCards[shopIdx] = null;
    card.bounce = 1.2;
    card.flash = 1;
    card.pulseColor = EDITIONS[card.edition].color;
    state.activeCards.push(card);
    sfx.buyCard();
    spawnPopup(168, 540, '-$' + card.price, COLORS.goldLight, 22);
    spawnParticles(796, 150, 20, [COLORS.goldLight, EDITIONS[card.edition].color, '#FFFFFF'], 70, 220);
  }

  function sellActiveCard(idx) {
    if ((state.mode !== 'PLAYING' && state.mode !== 'SHOP') || state.modal) return;
    const card = state.activeCards[idx];
    if (!card) return;

    // Prevent selling a Negative card if remaining non-negative cards would exceed slots?
    // Even better: allow selling Negative cards safely; if slots overflow, players just can't buy until below max.
    const val = card.sellValue;
    spawnPopup(card.x, card.y, '+$' + val, COLORS.goldLight, 24);
    spawnParticles(card.x, card.y, 14, [COLORS.goldLight, '#FFFFFF'], 60, 170);
    state.activeCards.splice(idx, 1);
    state.money += val;
    state.totalMoneyEarned += val;
    state.focusedActiveUid = null;
    sfx.sellCard();
  }

  function moveActiveCard(idx, delta) {
    if ((state.mode !== 'PLAYING' && state.mode !== 'SHOP') || state.modal) return;
    const target = idx + delta;
    if (target < 0 || target >= state.activeCards.length) return;
    const tmp = state.activeCards[idx];
    state.activeCards[idx] = state.activeCards[target];
    state.activeCards[target] = tmp;
    tmp.bounce = 0.7;
    sfx.cardSnap();
  }

  // =========================================================================
  // 8. LAYOUT CALCULATORS (ACTIVE CARD SLOTS & SHOP SLOTS)
  // =========================================================================
  function getActiveCardLayout() {
    const trayX = 356;
    const trayW = 880;
    const count = state.activeCards.length;
    const cardW = count > 6 ? Math.max(92, Math.floor((trayW - (count - 1) * 10) / count)) : 128;
    const cardH = Math.round(cardW * 1.36);
    const gap = count > 6 ? 10 : 18;
    const totalW = count > 0 ? count * cardW + (count - 1) * gap : 0;
    const startX = trayX + (trayW - totalW) / 2;
    const centerY = 148;
    return { cardW, cardH, gap, startX, centerY, trayX, trayW };
  }

  function getShopCardRects() {
    const cardW = 146;
    const cardH = 198;
    const gap = 58;
    const totalW = 3 * cardW + 2 * gap;
    const startX = 336 + (920 - totalW) / 2;
    const topY = 368;
    return [0, 1, 2].map(i => ({
      x: startX + i * (cardW + gap),
      y: topY,
      w: cardW,
      h: cardH
    }));
  }

  // =========================================================================
  // 9. CANVAS RENDERING — DICE, CARDS, EDITIONS, HUD & OVERLAYS
  // =========================================================================
  function drawDie(ctx, die, isTitle = false) {
    const debuffed = !isTitle && isDieDebuffedByBoss(die.value);
    engineDrawDie(ctx, state, die, isTitle, debuffed);
  }

  function drawPlayingCard(ctx, inst, cx, cy, w, h, opts = {}) {
    engineDrawPlayingCard(ctx, state, inst, cx, cy, w, h, opts);
  }

  function registerButton(id, x, y, w, h, label, opts = {}) {
    const rect = { x, y, w, h };
    const hovered = !opts.disabled && hitTest(state.mouseX, state.mouseY, rect);
    if (hovered) state.hoverButtonId = id;
    state.buttons.push({ id, rect, onClick: opts.onClick, disabled: !!opts.disabled });

    const {
      fill = COLORS.railPanel,
      hoverFill = '#1D303E',
      border = COLORS.railBorderBright,
      textColor = COLORS.textMain,
      fontSize = 15,
      sublabel = null,
      lip = 4,
      disabled = false
    } = opts;

    const pressY = hovered ? -1 : 0;
    ctx.save();
    ctx.globalAlpha = disabled ? 0.42 : 1;
    drawBevelPanel(ctx, x, y + pressY, w, h, {
      fill: hovered ? hoverFill : fill,
      border: hovered ? COLORS.brassBright : border,
      lip: disabled ? 2 : lip,
      r: 7,
      glow: hovered && opts.glow ? opts.glow : null
    });

    ctx.fillStyle = textColor;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `800 ${fontSize}px ui-sans-serif, system-ui, sans-serif`;
    if (sublabel) {
      ctx.fillText(label, x + w / 2, y + pressY + h / 2 - 8);
      ctx.font = '600 11px ui-monospace, SFMono-Regular, Menlo, monospace';
      ctx.fillStyle = 'rgba(243,247,245,0.78)';
      ctx.fillText(sublabel, x + w / 2, y + pressY + h / 2 + 11);
    } else {
      ctx.fillText(label, x + w / 2, y + pressY + h / 2 + 0.5);
    }
    ctx.restore();
  }

  function drawTableBackground() {
    engineDrawTableBackground(ctx, state);
  }

  function drawLeftHUD() {

    // 2. Round Score Progress Block
    const scY = isBoss ? y + 166 : y + 136;
    drawBevelPanel(ctx, x + 14, scY, w - 28, 94, {

    });

    const barX = x + 28, barY = scY + 72, barW = w - 56, barH = 10;
    ctx.fillStyle = '#091117';

    if (pct > 0) {

  function drawModifierCardTray() {
    const x = 336, y = 24, w = 920, h = 238;
    drawBevelPanel(ctx, x, y, w, h, {
      fill: 'rgba(6, 22, 16, 0.78)',
      border: 'rgba(217, 164, 65, 0.28)',
      lip: 4,
      r: 10
    });

    const usedSlots = getUsedCardSlots();
    const maxSlots = getMaxCardSlots();
    const negBonus = maxSlots - BASE_MAX_SLOTS;

    // Quiet unboxed header metadata
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.font = '800 12px ui-monospace, SFMono-Regular, Menlo, monospace';
    ctx.fillStyle = COLORS.brassBright;
    ctx.fillText('MODIFIER CARDS', x + 18, y + 12);

    ctx.fillStyle = COLORS.textMuted;
    ctx.font = '700 12px ui-monospace, SFMono-Regular, Menlo, monospace';
    const slotLabel = negBonus > 0
      ? `·  ${state.activeCards.length} / ${maxSlots} SLOTS (+${negBonus} Negative)`
      : `·  ${usedSlots} / ${BASE_MAX_SLOTS} SLOTS`;
    ctx.fillText(slotLabel, x + 144, y + 12);

    ctx.textAlign = 'right';
    ctx.font = '600 11.5px ui-sans-serif, system-ui, sans-serif';
    ctx.fillStyle = 'rgba(186, 212, 198, 0.65)';
    ctx.fillText('Triggers left → right · Drag or click card to reorder / sell', x + w - 18, y + 12);

    // Draw empty slot outlines when fewer than 5 cards
    const layout = getActiveCardLayout();
    if (state.activeCards.length === 0) {
      const emptyW = 114, emptyH = 156, gap = 22;
      const tot = 5 * emptyW + 4 * gap;
      const sx = x + (w - tot) / 2;
      for (let i = 0; i < 5; i++) {
        tracePixelRect(ctx, sx + i * (emptyW + gap), y + 48, emptyW, emptyH, 8);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 6]);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.textAlign = 'center';
      ctx.font = '600 14px ui-sans-serif, system-ui, sans-serif';
      ctx.fillStyle = 'rgba(195, 222, 208, 0.45)';
      ctx.fillText('Beat Stage 1 to visit the Shop and draft Playing Card modifiers', x + w / 2, y + 122);
      return;
    }

    // Update target positions and draw non-dragged cards first
    const canManage = (state.mode === 'PLAYING' || state.mode === 'SHOP') && !state.modal;

    state.activeCards.forEach((card, idx) => {
      card.targetX = layout.startX + idx * (layout.cardW + layout.gap) + layout.cardW / 2;
      card.targetY = layout.centerY;
      if (card.x === 0 && card.y === 0) {
        card.x = card.targetX;
        card.y = card.targetY;
      }
    });

    let draggedEntry = null;
    state.activeCards.forEach((card, idx) => {
      const isDragged = state.drag && state.drag.active && state.drag.card === card;
      if (isDragged) {
        draggedEntry = { card, idx };
        return;
      }
      const rect = {
        x: card.x - layout.cardW / 2,
        y: card.y - layout.cardH / 2,
        w: layout.cardW,
        h: layout.cardH
      };
      const isHovered = !state.modal && !state.drag?.active && hitTest(state.mouseX, state.mouseY, rect);
      if (isHovered) {
        state.hoveredCard = { zone: 'active', card, idx, rect };
      }
      const isFocused = state.focusedActiveUid === card.uid;

      drawPlayingCard(ctx, card, card.x, card.y, layout.cardW, layout.cardH, {
        debuffed: isCardDebuffedByBoss(idx),
        hovered: isHovered || isFocused
      });

      // Render precision controls (◀ | SELL | ▶) when focused or hovered in PLAYING/SHOP
      if (canManage && isFocused) {
        const barY = card.y + layout.cardH / 2 + 6;
        const bw = Math.max(122, layout.cardW + 6);
        const bx = card.x - bw / 2;
        registerButton(`card_left_${card.uid}`, bx, barY, 28, 24, '◀', {
          fill: '#172936', hoverFill: '#244054', fontSize: 11, lip: 2,
          disabled: idx === 0,
          onClick: () => moveActiveCard(idx, -1)
        });
        registerButton(`card_sell_${card.uid}`, bx + 31, barY, bw - 62, 24, `SELL $${card.sellValue}`, {
          fill: '#5C1E24', hoverFill: '#8B2630', border: '#F87171', fontSize: 10.5, lip: 2,
          onClick: () => sellActiveCard(idx)
        });
        registerButton(`card_right_${card.uid}`, bx + bw - 28, barY, 28, 24, '▶', {
          fill: '#172936', hoverFill: '#244054', fontSize: 11, lip: 2,
          disabled: idx === state.activeCards.length - 1,
          onClick: () => moveActiveCard(idx, 1)
        });
      }
    });

    // Draw dragged card on top
    if (draggedEntry) {
      drawPlayingCard(ctx, draggedEntry.card, state.drag.curX, state.drag.curY, layout.cardW, layout.cardH, {
        debuffed: isCardDebuffedByBoss(draggedEntry.idx),
        hovered: true,
        dragging: true,
        tilt: clamp((state.drag.curX - draggedEntry.card.x) * 0.004, -0.18, 0.18)
      });
    }
  }

    // Contextual status / scoring cascade banner

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    if (state.mode === 'SCORING' && state.scoringBanner) {
      drawBevelPanel(ctx, 446, 284, 700, 42, {

      ctx.fillText(state.scoringBanner, cx, 305);
    } else if (state.noticeTimer > 0 && state.noticeText) {
      drawBevelPanel(ctx, 446, 284, 700, 42, {

        lip: 3,

      fill: '#15803D',

      glow: 'rgba(74, 222, 128, 0.35)',

      fill: '#B45309',

      fontSize: 18,

      glow: 'rgba(252, 211, 77, 0.3)',

      fill: '#182834',
      hoverFill: '#243B4D',
      border: COLORS.railBorderBright,
      fontSize: 15,

  function drawShopArena() {
    const x = 336, y = 278, w = 920, h = 458;
    drawBevelPanel(ctx, x, y, w, h, {
      fill: 'rgba(13, 23, 30, 0.90)',
      border: COLORS.brass,
      lip: 5,
      r: 10
    });

    // Shop Header
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.font = '900 24px ui-sans-serif, system-ui, sans-serif';
    ctx.fillStyle = COLORS.brassBright;
    ctx.fillText('CARD SHOP', x + 26, y + 18);

    const nextStage = state.stage + 1;
    const nextIsBoss = nextStage % 3 === 0;
    ctx.textAlign = 'right';
    ctx.font = '700 13px ui-monospace, SFMono-Regular, Menlo, monospace';
    ctx.fillStyle = nextIsBoss ? COLORS.multLight : COLORS.textMuted;
    ctx.fillText(
      `Next: Stage ${nextStage} (${getStageLabel(nextStage)}) · Target ${fmtNum(getStageTarget(nextStage))}`,
      x + w - 26,
      y + 24
    );

    if (state.noticeTimer > 0 && state.noticeText) {
      ctx.textAlign = 'center';
      ctx.font = '700 13px ui-sans-serif, system-ui, sans-serif';
      ctx.fillStyle = '#FECACA';
      ctx.fillText(state.noticeText, x + w / 2, y + 54);
    } else {
      ctx.textAlign = 'center';
      ctx.font = '600 13px ui-sans-serif, system-ui, sans-serif';
      ctx.fillStyle = COLORS.textMuted;
      ctx.fillText('Hover any card for trigger & edition details · Save $5 increments for Interest', x + w / 2, y + 54);
    }

    // 3 Showcase Cards
    const rects = getShopCardRects();
    const slotsFull = state.activeCards.length >= getMaxCardSlots();

    rects.forEach((r, idx) => {
      const card = state.shopCards[idx];

      // Pedestal backing
      tracePixelRect(ctx, r.x - 14, r.y - 12, r.w + 28, r.h + 76, 10);
      ctx.fillStyle = 'rgba(5, 13, 18, 0.65)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      if (!card) {
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '800 15px ui-monospace, SFMono-Regular, Menlo, monospace';
        ctx.fillStyle = COLORS.textDim;
        ctx.fillText('SOLD', r.x + r.w / 2, r.y + r.h / 2);
        return;
      }

      const hovered = !state.modal && hitTest(state.mouseX, state.mouseY, r);
      if (hovered) {
        state.hoveredCard = { zone: 'shop', card, idx, rect: r };
      }

      drawPlayingCard(ctx, card, r.x + r.w / 2, r.y + r.h / 2, r.w, r.h, {
        hovered
      });

      const isNeg = card.edition === 'negative';
      const canAfford = state.money >= card.price;
      const canFit = isNeg || !slotsFull;
      const buyDisabled = !canAfford || !canFit || Boolean(state.modal);
      let buyLabel = `BUY $${card.price}`;
      if (!canFit) buyLabel = 'SLOTS FULL';
      else if (isNeg) buyLabel = `BUY $${card.price} (+1)`;

      registerButton(`shop_buy_${idx}`, r.x - 4, r.y + r.h + 14, r.w + 8, 40, buyLabel, {
        fill: buyDisabled ? '#1B252E' : '#15803D',
        hoverFill: '#16A34A',
        border: buyDisabled ? COLORS.railBorder : '#4ADE80',
        fontSize: 14,
        disabled: buyDisabled,
        onClick: () => buyShopCard(idx)
      });
    });

    // Bottom Shop Action Bar
    const actY = y + h - 76;
    registerButton('shop_reroll', x + 150, actY, 260, 56, `REROLL SHOP ($${SHOP_REROLL_COST})`, {
      fill: '#B45309',
      hoverFill: '#D97706',
      border: '#FCD34D',
      fontSize: 16,
      sublabel: 'Fresh 3 cards  [R]',
      disabled: state.money < SHOP_REROLL_COST || Boolean(state.modal),
      onClick: rerollShop
    });

    registerButton('shop_next', x + w - 410, actY, 260, 56, `NEXT STAGE (${nextStage}) ▸`, {
      fill: '#2563EB',
      hoverFill: '#3B82F6',
      border: '#93C5FD',
      fontSize: 17,
      sublabel: `${getStageLabel(nextStage)}  [Space]`,
      glow: 'rgba(96, 165, 250, 0.35)',
      disabled: Boolean(state.modal),
      onClick: () => startStage(nextStage)
    });
  }

  function drawCardTooltip() {
    if (!state.hoveredCard || state.modal || (state.drag && state.drag.active)) return;
    const { zone, card, idx, rect } = state.hoveredCard;
    const def = CARD_BY_ID[card.cardId];
    const ed = EDITIONS[card.edition];
    const debuffed = zone === 'active' && isCardDebuffedByBoss(idx);

    const tipW = 286;
    ctx.font = '600 13px ui-sans-serif, system-ui, sans-serif';
    const descLines = wrapLines(ctx, def.desc, tipW - 28);
    let tipH = 66 + descLines.length * 18;
    if (ed.bonusText) tipH += 26;
    if (def.isScaling) tipH += 22;
    if (debuffed) tipH += 24;
    tipH += 24; // Footer sell/price line

    let tx = rect.x + rect.w / 2 - tipW / 2;
    tx = clamp(tx, 336, LOGICAL_W - tipW - 18);
    // Position below active tray cards, or above shop cards
    let ty = zone === 'active' ? rect.y + rect.h + 38 : rect.y - tipH - 16;
    if (ty + tipH > LOGICAL_H - 14) ty = rect.y - tipH - 12;
    if (ty < 14) ty = 14;

    drawBevelPanel(ctx, tx, ty, tipW, tipH, {
      fill: 'rgba(10, 17, 24, 0.97)',
      border: card.edition !== 'standard' ? ed.color : COLORS.brassBright,
      lip: 4,
      r: 8,
      glow: 'rgba(0,0,0,0.6)'
    });

    let curY = ty + 14;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.font = '800 15px ui-sans-serif, system-ui, sans-serif';
    ctx.fillStyle = COLORS.textMain;
    ctx.fillText(def.name, tx + 14, curY);

  // =========================================================================
  // 10. SIMULATION UPDATE LOOP (CLAMPED DELTA TIME <= 0.05s)
  // =========================================================================
  function update(dt) {
    state.time += dt;

    if (state.noticeTimer > 0) state.noticeTimer = Math.max(0, state.noticeTimer - dt);

    // Animated stage score counter tick-up
    if (state.displayScore < state.stageScore) {
      const diff = state.stageScore - state.displayScore;
      const step = Math.max(12, diff * Math.min(1, dt * 11));
      state.displayScore = Math.min(state.stageScore, state.displayScore + step);
      state.scoreTickAccum += dt;
      if (state.scoreTickAccum >= 0.045) {
        state.scoreTickAccum = 0;
        sfx.scoreTick();
      }
    } else if (state.displayScore > state.stageScore) {
      state.displayScore = state.stageScore;
    }

    // Dice bounce & tumble physics
    for (const d of state.dice) {
      if (d.tumbleTimer > 0) {
        d.tumbleTimer = Math.max(0, d.tumbleTimer - dt);
        d.vy += 1850 * dt;
        d.y += d.vy * dt;
        d.angle += d.vAngle * dt;
        if (d.y >= d.targetY) {
          d.y = d.targetY;
          d.vy = -Math.abs(d.vy) * 0.42;
          d.vAngle *= 0.6;
        }
        if (d.tumbleTimer === 0) {
          d.y = d.targetY;
          d.vy = 0;
          d.angle = 0;
          d.vAngle = 0;
        }
      } else {
        d.y = lerp(d.y, d.targetY, Math.min(1, dt * 16));
        d.angle = lerp(d.angle, 0, Math.min(1, dt * 16));
      }
      d.scale = lerp(d.scale, 1, Math.min(1, dt * 14));
      d.hop = Math.max(0, d.hop - dt * 3.4);
      d.flash = Math.max(0, d.flash - dt * 3.2);
    }

    // Smooth card movement & bounce decay
    for (const c of state.activeCards) {
      if (!(state.drag && state.drag.active && state.drag.card === c)) {
        c.x = lerp(c.x, c.targetX, Math.min(1, dt * 15));
        c.y = lerp(c.y, c.targetY, Math.min(1, dt * 15));
      }
      c.bounce = Math.max(0, c.bounce - dt * 3.8);
      c.flash = Math.max(0, c.flash - dt * 2.8);
    }

    // Scoring cascade scheduler
    if (state.mode === 'SCORING' && !state.modal) {
      state.scoringTimer -= dt;
      if (state.scoringTimer <= 0) {
        if (state.scoringQueue.length > 0) {
          const nextStep = state.scoringQueue.shift();
          executeScoringStep(nextStep);
          state.scoringTimer = nextStep.duration;
        } else {
          finishScoringPhase();
        }
      }
    }

    // Cash-out progressive row reveal
    if (state.mode === 'CASH_OUT') {
      state.cashOutReveal = Math.min(1.2, state.cashOutReveal + dt * 1.45);
    }

    // Update particles, popups, screen shake & hit flash
    updateGraphicsEffects(state, dt);
  }

  function render() {
    ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
    drawTableBackground();

    // Reset per-frame UI interaction registries
    state.buttons = [];
    state.hoverButtonId = null;
    state.hoveredCard = null;

    // Apply logical coordinate scaling + decaying camera shake
    const shakeX = state.shakeMag > 0.1 ? (Math.random() - 0.5) * 2 * state.shakeMag : 0;
    const shakeY = state.shakeMag > 0.1 ? (Math.random() - 0.5) * 2 * state.shakeMag : 0;

    ctx.save();
    ctx.translate(state.ox + shakeX * state.scale, state.oy + shakeY * state.scale);
    ctx.scale(state.scale, state.scale);

    if (state.mode === 'TITLE_MENU') {
      drawTitleScreen();
    } else {
      drawLeftHUD();
      drawModifierCardTray();
      if (state.mode === 'PLAYING' || state.mode === 'SCORING') {
        drawPlayArena();
      } else if (state.mode === 'CASH_OUT') {
        drawCashOutPanel();
      } else if (state.mode === 'SHOP') {
        drawShopArena();
      } else if (state.mode === 'VICTORY') {
        drawEndModal(true);
      } else if (state.mode === 'GAME_OVER') {
        drawEndModal(false);
      }
    }

    drawParticlesAndPopups();
    drawCardTooltip();
    drawOverlayModal();

    // Hit flash on big blind clears
    drawHitFlash(ctx, state, LOGICAL_W, LOGICAL_H);

    ctx.restore();
    drawCRTOverlay();

    // Cursor polish
    let cursor = 'default';
    if (state.drag && state.drag.active) cursor = 'grabbing';
    else if (state.hoverButtonId) cursor = 'pointer';
    else if (state.hoveredCard) cursor = state.hoveredCard.zone === 'active' ? 'grab' : 'pointer';
    else if (state.mode === 'PLAYING' && !state.modal && findHoveredDieIndex(state.mouseX, state.mouseY) !== -1) cursor = 'pointer';
    canvas.style.cursor = cursor;
  }

  // =========================================================================
  // 11. INPUT HANDLING (POINTER, DRAG-AND-DROP, KEYBOARD)
  // =========================================================================
  function resize() {
    state.vw = window.innerWidth;
    state.vh = window.innerHeight;
    state.dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(state.vw * state.dpr);
    canvas.height = Math.round(state.vh * state.dpr);
    state.scale = Math.min(state.vw / LOGICAL_W, state.vh / LOGICAL_H);
    state.ox = (state.vw - LOGICAL_W * state.scale) / 2;
    state.oy = (state.vh - LOGICAL_H * state.scale) / 2;
  }

  function clientToLogical(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (clientX - rect.left - state.ox) / state.scale,
      y: (clientY - rect.top - state.oy) / state.scale
    };
  }

  function findHoveredDieIndex(lx, ly) {
    for (let i = 0; i < state.dice.length; i++) {
      const d = state.dice[i];
      const liftY = d.selected ? -34 : 0;
      const cx = d.x;
      const cy = d.y + liftY;
      if (Math.abs(lx - cx) <= 58 && Math.abs(ly - cy) <= 58) return i;
    }
    return -1;
  }

  function findActiveCardIndex(lx, ly) {
    const layout = getActiveCardLayout();
    for (let i = 0; i < state.activeCards.length; i++) {
      const c = state.activeCards[i];
      if (
        lx >= c.x - layout.cardW / 2 && lx <= c.x + layout.cardW / 2 &&
        ly >= c.y - layout.cardH / 2 && ly <= c.y + layout.cardH / 2
      ) {
        return i;
      }
    }
    return -1;
  }

  canvas.addEventListener('pointerdown', (e) => {
    sfx.unlock();
    const { x, y } = clientToLogical(e.clientX, e.clientY);
    state.mouseX = x;
    state.mouseY = y;

    // 1. Check UI buttons (reverse order so modals on top catch first)
    for (let i = state.buttons.length - 1; i >= 0; i--) {
      const b = state.buttons[i];
      if (!b.disabled && hitTest(x, y, b.rect)) {
        b.onClick();
        return;
      }
    }

    if (state.modal) return;

    // 2. Check active modifier cards for click-focus OR drag-and-drop reorder
    if (state.mode === 'PLAYING' || state.mode === 'SHOP') {
      const cIdx = findActiveCardIndex(x, y);
      if (cIdx !== -1) {
        const card = state.activeCards[cIdx];
        state.drag = {
          card,
          fromIdx: cIdx,
          startX: x,
          startY: y,
          curX: x,
          curY: y,
          active: false
        };
        return;
      }
    }

    // Clicking empty space dismisses card action strip
    state.focusedActiveUid = null;

    // 3. Check dice click in PLAYING state
    if (state.mode === 'PLAYING') {
      const dIdx = findHoveredDieIndex(x, y);
      if (dIdx !== -1) {
        toggleDieSelection(dIdx);
        return;
      }
    }
  });

  window.addEventListener('pointermove', (e) => {
    const { x, y } = clientToLogical(e.clientX, e.clientY);
    state.mouseX = x;
    state.mouseY = y;

    if (state.drag) {
      state.drag.curX = x;
      state.drag.curY = y;
      if (!state.drag.active && Math.hypot(x - state.drag.startX, y - state.drag.startY) > 10) {
        state.drag.active = true;
        state.focusedActiveUid = null;
      }
      if (state.drag.active) {
        const curIdx = state.activeCards.indexOf(state.drag.card);
        if (curIdx !== -1) {
          const layout = getActiveCardLayout();
          const relX = x - layout.startX;
          const slotStride = layout.cardW + layout.gap;
          const desiredIdx = clamp(Math.floor(relX / slotStride), 0, state.activeCards.length - 1);
          if (desiredIdx !== curIdx) {
            state.activeCards.splice(curIdx, 1);
            state.activeCards.splice(desiredIdx, 0, state.drag.card);
            sfx.cardSnap();
          }
        }
      }
    }
  });

  window.addEventListener('pointerup', () => {
    if (state.drag) {
      if (!state.drag.active) {
        // Short click toggles precision arrow & sell controls
        const uid = state.drag.card.uid;
        state.focusedActiveUid = state.focusedActiveUid === uid ? null : uid;
        sfx.click();
      } else {
        state.drag.card.bounce = 0.5;
        sfx.cardSnap();
      }
      state.drag = null;
    }
  });

  window.addEventListener('blur', () => {
    state.drag = null;
  });

  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    sfx.unlock();

    if (e.key === 'Escape') {
      if (state.modal) {
        sfx.click();
        state.modal = null;
      } else if (state.mode === 'PLAYING' || state.mode === 'SHOP') {
        sfx.click();
        state.modal = 'PAUSE';
      }
      return;
    }

    if (state.modal) return;

    if (state.mode === 'TITLE_MENU') {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        startNewRun();
      }
      return;
    }

    if (state.mode === 'PLAYING') {
      if (e.key >= '1' && e.key <= '5') {
        toggleDieSelection(Number(e.key) - 1);
      } else if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        playSelectedHand();
      } else if (e.key === 'r' || e.key === 'R') {
        triggerReroll();
      } else if (e.key === 'c' || e.key === 'C') {
        clearSelectedDice();
      }
      return;
    }

    if (state.mode === 'CASH_OUT') {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        claimCashOut();
      }
      return;
    }

    if (state.mode === 'SHOP') {
      if (e.key === 'r' || e.key === 'R') {
        rerollShop();
      } else if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        startStage(state.stage + 1);
      }
    }
  });

  window.addEventListener('resize', resize);

  // =========================================================================
  // 12. BOOTSTRAP & MAIN LOOP
  // =========================================================================
  resize();
  initTitleBackdrop();

  let lastTime = performance.now();
  function frame(now) {
    const rawDt = (now - lastTime) / 1000;
    lastTime = now;
    const dt = Math.min(Math.max(rawDt, 0), 0.05);
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
