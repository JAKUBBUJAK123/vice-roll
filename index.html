  function drawOverlayModal() {
    if (!state.modal) return;
    state.buttons = [];
    state.hoverButtonId = null;
    state.hoveredCard = null;
    ctx.fillStyle = 'rgba(3, 10, 8, 0.78)';
    ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

    if (state.modal === 'PAUSE') {
      const w = 420, h = 330;
      const x = (LOGICAL_W - w) / 2, y = (LOGICAL_H - h) / 2;
      drawBevelPanel(ctx, x, y, w, h, {
        fill: '#0F1A22', border: COLORS.brassBright, lip: 6, r: 12
      });
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.font = '900 26px ui-sans-serif, system-ui, sans-serif';
      ctx.fillStyle = COLORS.textMain;
      ctx.fillText('PAUSED', x + w / 2, y + 28);

      registerButton('pause_resume', x + 60, y + 88, w - 120, 48, 'RESUME RUN', {
        fill: '#15803D', hoverFill: '#16A34A', border: '#4ADE80', fontSize: 16,
        onClick: () => { sfx.click(); state.modal = null; }
      });
      registerButton('pause_restart', x + 60, y + 150, w - 120, 48, 'RESTART RUN', {
        fill: '#B45309', hoverFill: '#D97706', border: '#FCD34D', fontSize: 15,
        onClick: startNewRun
      });
      registerButton('pause_title', x + 60, y + 212, w - 120, 48, 'EXIT TO TITLE', {
        fill: '#1A2B38', hoverFill: '#253D4F', fontSize: 15,
        onClick: () => { sfx.click(); state.modal = null; state.mode = 'TITLE_MENU'; }
      });
      return;
    }

    if (state.modal === 'GUIDE') {
      const w = 820, h = 580;
      const x = (LOGICAL_W - w) / 2, y = (LOGICAL_H - h) / 2;
      drawBevelPanel(ctx, x, y, w, h, {
        fill: '#0F1A22', border: COLORS.brassBright, lip: 6, r: 12
      });

      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.font = '900 24px ui-sans-serif, system-ui, sans-serif';
      ctx.fillStyle = COLORS.brassBright;
      ctx.fillText('SCORING HANDS & EDITIONS', x + 32, y + 24);

      registerButton('guide_close', x + w - 124, y + 20, 92, 36, 'CLOSE', {
        fill: '#1A2B38', hoverFill: '#284154', fontSize: 13,
        onClick: () => { sfx.click(); state.modal = null; }
      });

      // Left column: 3-Dice Scoring Hands
      ctx.font = '800 13px ui-monospace, SFMono-Regular, Menlo, monospace';
      ctx.fillStyle = COLORS.textMuted;
      ctx.fillText('3-DICE HANDS (Each scored die adds its pips to Chips)', x + 32, y + 72);

      let hy = y + 100;
      for (const hid of HAND_ORDER.slice().reverse()) {
        const hd = HANDS[hid];
        drawBevelPanel(ctx, x + 32, hy, 420, 56, {
          fill: '#14232E', border: COLORS.railBorder, lip: 2, r: 6
        });
        ctx.textAlign = 'left';
        ctx.font = '800 15px ui-sans-serif, system-ui, sans-serif';
        ctx.fillStyle = COLORS.textMain;
        ctx.fillText(hd.name, x + 46, hy + 10);
        ctx.font = '600 12px ui-sans-serif, system-ui, sans-serif';
        ctx.fillStyle = COLORS.textMuted;
        ctx.fillText(hd.desc, x + 46, hy + 31);

        ctx.textAlign = 'right';
        ctx.font = '800 15px ui-monospace, SFMono-Regular, Menlo, monospace';
        ctx.fillStyle = COLORS.chipsLight;
        ctx.fillText(`${hd.chips}`, x + 378, hy + 20);
        ctx.fillStyle = COLORS.textMuted;
        ctx.fillText('×', x + 396, hy + 20);
        ctx.fillStyle = COLORS.multLight;
        ctx.fillText(`${hd.mult}`, x + 436, hy + 20);
        hy += 66;
      }

      // Right column: Card Editions + Economy
      const rx = x + 480;
      ctx.textAlign = 'left';
      ctx.font = '800 13px ui-monospace, SFMono-Regular, Menlo, monospace';
      ctx.fillStyle = COLORS.textMuted;
      ctx.fillText('CARD EDITIONS (Rolled in Shop)', rx, y + 72);

      const edList = [
        ['Standard (80%)', 'Normal card behavior', '#CBD5E1'],
        ['Foil (8%)', '+50 Chips when triggered', '#60A5FA'],
        ['Holographic (7%)', '+12 Mult when triggered', '#F472B6'],
        ['Polychrome (3%)', 'x1.5 Mult when triggered', '#C084FC'],
        ['Negative (2%)', '+1 Max Card Slot (0 space)', '#38BDF8']
      ];
      let ey = y + 102;
      for (const [name, txt, col] of edList) {
        ctx.font = '800 14px ui-sans-serif, system-ui, sans-serif';
        ctx.fillStyle = col;
        ctx.fillText(name, rx, ey);
        ctx.font = '600 12.5px ui-sans-serif, system-ui, sans-serif';
        ctx.fillStyle = '#D1E0E8';
        ctx.fillText(txt, rx, ey + 19);
        ey += 48;
      }

      // Pro Tips box
      drawBevelPanel(ctx, rx, ey + 10, 308, 134, {
        fill: '#13211C', border: '#275948', lip: 2, r: 7
      });
      ctx.font = '800 12.5px ui-monospace, SFMono-Regular, Menlo, monospace';
      ctx.fillStyle = COLORS.brassBright;
      ctx.fillText('STRATEGY TIPS', rx + 14, ey + 24);
      ctx.font = '600 12px ui-sans-serif, system-ui, sans-serif';
      ctx.fillStyle = '#CFE3DA';
      const tips = [
        '• Place +Mult cards LEFT of xMult cards.',
        '• Keep $25 banked for max +$5 Interest.',
        '• Reroll keeps selected dice locked.',
        '• Every 3rd stage has a Boss modifier.'
      ];
      tips.forEach((t, i) => ctx.fillText(t, rx + 14, ey + 48 + i * 21));

      // Footer shortcut line
      ctx.textAlign = 'center';
      ctx.font = '600 12px ui-monospace, SFMono-Regular, Menlo, monospace';
      ctx.fillStyle = COLORS.textMuted;
      ctx.fillText('Shortcuts: Keys 1–5 Toggle Dice · Space Play · R Reroll · C Clear · Esc Close', x + w / 2, y + h - 32);
    }
  }

  function drawParticlesAndPopups() {
    for (const p of state.particles) {
      const a = 1 - p.life / p.maxLife;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = clamp(a, 0, 1);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      ctx.restore();
    }

    for (const pop of state.popups) {
      const t = pop.life / pop.maxLife;
      const alpha = t < 0.72 ? 1 : 1 - (t - 0.72) / 0.28;
      ctx.save();
      ctx.translate(pop.x, pop.y);
      ctx.scale(pop.scale, pop.scale);
      ctx.globalAlpha = clamp(alpha, 0, 1);
      ctx.font = `900 ${pop.size}px ui-monospace, SFMono-Regular, Menlo, monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 5;
      ctx.strokeStyle = 'rgba(5, 11, 14, 0.92)';
      ctx.strokeText(pop.text, 0, 0);
      ctx.fillStyle = pop.color;
      ctx.fillText(pop.text, 0, 0);
      ctx.restore();
    }
  }

  function drawCRTOverlay() {
    if (!state.crtEnabled) return;
    ctx.save();
    // Crisp subtle horizontal scanlines
    ctx.fillStyle = 'rgba(0, 0, 0, 0.14)';
    for (let y = 0; y < state.vh; y += 3) {
      ctx.fillRect(0, y, state.vw, 1);
    }
    // Subtle corner CRT vignette & phosphor bloom
    const cx = state.vw / 2, cy = state.vh / 2;
    const rad = ctx.createRadialGradient(cx, cy, Math.min(state.vw, state.vh) * 0.36, cx, cy, Math.hypot(cx, cy));
    rad.addColorStop(0, 'rgba(60, 255, 180, 0.025)');
    rad.addColorStop(0.75, 'rgba(0, 0, 0, 0.04)');
    rad.addColorStop(1, 'rgba(0, 0, 0, 0.42)');
    ctx.fillStyle = rad;
    ctx.fillRect(0, 0, state.vw, state.vh);
    ctx.restore();
  }

  // =========================================================================
  // 10. SIMULATION UPDATE LOOP (CLAMPED DELTA TIME <= 0.05s)
  // =========================================================================
  function update(dt) {
    state.time += dt;

    if (state.noticeTimer > 0) state.noticeTimer = Math.max(0, state.noticeTimer - dt);
    if (state.shakeMag > 0.1) state.shakeMag *= Math.pow(0.0015, dt);
    else state.shakeMag = 0;
    if (state.hitFlash > 0.01) state.hitFlash = Math.max(0, state.hitFlash - dt * 1.8);

    // Animated stage score counter tick-up
    if (state.displayScore < state.stageScore) {
      const diff = state.stageScore - state.displayScore;
      const step = Math.max(12, diff * Math.min(1, dt * 11));
      state.displayScore = Math.min(state.stageScore, state.displayScore + step);
      state.scoreTickAccum += dt;
      if (state.scoreTickAccum >= 0.045) {
        state.scoreTickAccum = 0;
        sfx.scoreTick();
      }
    } else if (state.displayScore > state.stageScore) {
      state.displayScore = state.stageScore;
    }

    // Dice bounce & tumble physics
    for (const d of state.dice) {
      if (d.tumbleTimer > 0) {
        d.tumbleTimer = Math.max(0, d.tumbleTimer - dt);
        d.vy += 1850 * dt;
        d.y += d.vy * dt;
        d.angle += d.vAngle * dt;
        if (d.y >= d.targetY) {
          d.y = d.targetY;
          d.vy = -Math.abs(d.vy) * 0.42;
          d.vAngle *= 0.6;
        }
        if (d.tumbleTimer === 0) {
          d.y = d.targetY;
          d.vy = 0;
          d.angle = 0;
          d.vAngle = 0;
        }
      } else {
        d.y = lerp(d.y, d.targetY, Math.min(1, dt * 16));
        d.angle = lerp(d.angle, 0, Math.min(1, dt * 16));
      }
      d.scale = lerp(d.scale, 1, Math.min(1, dt * 14));
      d.hop = Math.max(0, d.hop - dt * 3.4);
      d.flash = Math.max(0, d.flash - dt * 3.2);
    }

    // Smooth card movement & bounce decay
    for (const c of state.activeCards) {
      if (!(state.drag && state.drag.active && state.drag.card === c)) {
        c.x = lerp(c.x, c.targetX, Math.min(1, dt * 15));
        c.y = lerp(c.y, c.targetY, Math.min(1, dt * 15));
      }
      c.bounce = Math.max(0, c.bounce - dt * 3.8);
      c.flash = Math.max(0, c.flash - dt * 2.8);
    }

    // Scoring cascade scheduler
    if (state.mode === 'SCORING' && !state.modal) {
      state.scoringTimer -= dt;
      if (state.scoringTimer <= 0) {
        if (state.scoringQueue.length > 0) {
          const nextStep = state.scoringQueue.shift();
          executeScoringStep(nextStep);
          state.scoringTimer = nextStep.duration;
        } else {
          finishScoringPhase();
        }
      }
    }

    // Cash-out progressive row reveal
    if (state.mode === 'CASH_OUT') {
      state.cashOutReveal = Math.min(1.2, state.cashOutReveal + dt * 1.45);
    }

    // Particles & popups
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.life += dt;
      if (p.life >= p.maxLife) {
        state.particles.splice(i, 1);
      } else {
        p.vy += 420 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.rot += p.vrot * dt;
      }
    }
    for (let i = state.popups.length - 1; i >= 0; i--) {
      const pop = state.popups[i];
      pop.life += dt;
      if (pop.life >= pop.maxLife) {
        state.popups.splice(i, 1);
      } else {
        pop.y += pop.vy * dt;
        pop.vy *= Math.pow(0.18, dt);
        pop.scale = lerp(pop.scale, 1, Math.min(1, dt * 18));
      }
    }
  }

  function render() {
    ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
    drawTableBackground();

    // Reset per-frame UI interaction registries
    state.buttons = [];
    state.hoverButtonId = null;
    state.hoveredCard = null;

    // Apply logical coordinate scaling + decaying camera shake
    const shakeX = state.shakeMag > 0.1 ? (Math.random() - 0.5) * 2 * state.shakeMag : 0;
    const shakeY = state.shakeMag > 0.1 ? (Math.random() - 0.5) * 2 * state.shakeMag : 0;

    ctx.save();
    ctx.translate(state.ox + shakeX * state.scale, state.oy + shakeY * state.scale);
    ctx.scale(state.scale, state.scale);

    if (state.mode === 'TITLE_MENU') {
      drawTitleScreen();
    } else {
      drawLeftHUD();
      drawModifierCardTray();
      if (state.mode === 'PLAYING' || state.mode === 'SCORING') {
        drawPlayArena();
      } else if (state.mode === 'CASH_OUT') {
        drawCashOutPanel();
      } else if (state.mode === 'SHOP') {
        drawShopArena();
      } else if (state.mode === 'VICTORY') {
        drawEndModal(true);
      } else if (state.mode === 'GAME_OVER') {
        drawEndModal(false);
      }
    }

    drawParticlesAndPopups();
    drawCardTooltip();
    drawOverlayModal();

    // Hit flash on big blind clears
    if (state.hitFlash > 0.01) {
      ctx.fillStyle = `rgba(253, 224, 71, ${state.hitFlash * 0.22})`;
      ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
    }

    ctx.restore();
    drawCRTOverlay();

    // Cursor polish
    let cursor = 'default';
    if (state.drag && state.drag.active) cursor = 'grabbing';
    else if (state.hoverButtonId) cursor = 'pointer';
    else if (state.hoveredCard) cursor = state.hoveredCard.zone === 'active' ? 'grab' : 'pointer';
    else if (state.mode === 'PLAYING' && !state.modal && findHoveredDieIndex(state.mouseX, state.mouseY) !== -1) cursor = 'pointer';
    canvas.style.cursor = cursor;
  }

  // =========================================================================
  // 11. INPUT HANDLING (POINTER, DRAG-AND-DROP, KEYBOARD)
  // =========================================================================
  function resize() {
    state.vw = window.innerWidth;
    state.vh = window.innerHeight;
    state.dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(state.vw * state.dpr);
    canvas.height = Math.round(state.vh * state.dpr);
    state.scale = Math.min(state.vw / LOGICAL_W, state.vh / LOGICAL_H);
    state.ox = (state.vw - LOGICAL_W * state.scale) / 2;
    state.oy = (state.vh - LOGICAL_H * state.scale) / 2;
  }

  function clientToLogical(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (clientX - rect.left - state.ox) / state.scale,
      y: (clientY - rect.top - state.oy) / state.scale
    };
  }

  function findHoveredDieIndex(lx, ly) {
    for (let i = 0; i < state.dice.length; i++) {
      const d = state.dice[i];
      const liftY = d.selected ? -34 : 0;
      const cx = d.x;
      const cy = d.y + liftY;
      if (Math.abs(lx - cx) <= 58 && Math.abs(ly - cy) <= 58) return i;
    }
    return -1;
  }

  function findActiveCardIndex(lx, ly) {
    const layout = getActiveCardLayout();
    for (let i = 0; i < state.activeCards.length; i++) {
      const c = state.activeCards[i];
      if (
        lx >= c.x - layout.cardW / 2 && lx <= c.x + layout.cardW / 2 &&
        ly >= c.y - layout.cardH / 2 && ly <= c.y + layout.cardH / 2
      ) {
        return i;
      }
    }
    return -1;
  }

  canvas.addEventListener('pointerdown', (e) => {
    sfx.unlock();
    const { x, y } = clientToLogical(e.clientX, e.clientY);
    state.mouseX = x;
    state.mouseY = y;

    // 1. Check UI buttons (reverse order so modals on top catch first)
    for (let i = state.buttons.length - 1; i >= 0; i--) {
      const b = state.buttons[i];
      if (!b.disabled && hitTest(x, y, b.rect)) {
        b.onClick();
        return;
      }
    }

    if (state.modal) return;

    // 2. Check active modifier cards for click-focus OR drag-and-drop reorder
    if (state.mode === 'PLAYING' || state.mode === 'SHOP') {
      const cIdx = findActiveCardIndex(x, y);
      if (cIdx !== -1) {
        const card = state.activeCards[cIdx];
        state.drag = {
          card,
          fromIdx: cIdx,
          startX: x,
          startY: y,
          curX: x,
          curY: y,
          active: false
        };
        return;
      }
    }

    // Clicking empty space dismisses card action strip
    state.focusedActiveUid = null;

    // 3. Check dice click in PLAYING state
    if (state.mode === 'PLAYING') {
      const dIdx = findHoveredDieIndex(x, y);
      if (dIdx !== -1) {
        toggleDieSelection(dIdx);
        return;
      }
    }
  });

  window.addEventListener('pointermove', (e) => {
    const { x, y } = clientToLogical(e.clientX, e.clientY);
    state.mouseX = x;
    state.mouseY = y;

    if (state.drag) {
      state.drag.curX = x;
      state.drag.curY = y;
      if (!state.drag.active && Math.hypot(x - state.drag.startX, y - state.drag.startY) > 10) {
        state.drag.active = true;
        state.focusedActiveUid = null;
      }
      if (state.drag.active) {
        const curIdx = state.activeCards.indexOf(state.drag.card);
        if (curIdx !== -1) {
          const layout = getActiveCardLayout();
          const relX = x - layout.startX;
          const slotStride = layout.cardW + layout.gap;
          const desiredIdx = clamp(Math.floor(relX / slotStride), 0, state.activeCards.length - 1);
          if (desiredIdx !== curIdx) {
            state.activeCards.splice(curIdx, 1);
            state.activeCards.splice(desiredIdx, 0, state.drag.card);
            sfx.cardSnap();
          }
        }
      }
    }
  });

  window.addEventListener('pointerup', () => {
    if (state.drag) {
      if (!state.drag.active) {
        // Short click toggles precision arrow & sell controls
        const uid = state.drag.card.uid;
        state.focusedActiveUid = state.focusedActiveUid === uid ? null : uid;
        sfx.click();
      } else {
        state.drag.card.bounce = 0.5;
        sfx.cardSnap();
      }
      state.drag = null;
    }
  });

  window.addEventListener('blur', () => {
    state.drag = null;
  });

  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    sfx.unlock();

    if (e.key === 'Escape') {
      if (state.modal) {
        sfx.click();
        state.modal = null;
      } else if (state.mode === 'PLAYING' || state.mode === 'SHOP') {
        sfx.click();
        state.modal = 'PAUSE';
      }
      return;
    }

    if (state.modal) return;

    if (state.mode === 'TITLE_MENU') {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        startNewRun();
      }
      return;
    }

    if (state.mode === 'PLAYING') {
      if (e.key >= '1' && e.key <= '5') {
        toggleDieSelection(Number(e.key) - 1);
      } else if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        playSelectedHand();
      } else if (e.key === 'r' || e.key === 'R') {
        triggerReroll();
      } else if (e.key === 'c' || e.key === 'C') {
        clearSelectedDice();
      }
      return;
    }

    if (state.mode === 'CASH_OUT') {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        claimCashOut();
      }
      return;
    }

    if (state.mode === 'SHOP') {
      if (e.key === 'r' || e.key === 'R') {
        rerollShop();
      } else if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        startStage(state.stage + 1);
      }
    }
  });

  window.addEventListener('resize', resize);

  // =========================================================================
  // 12. BOOTSTRAP & MAIN LOOP
  // =========================================================================
  resize();
  initTitleBackdrop();

  let lastTime = performance.now();
  function frame(now) {
    const rawDt = (now - lastTime) / 1000;
    lastTime = now;
    const dt = Math.min(Math.max(rawDt, 0), 0.05);
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
