<canvas id="game-canvas" aria-label="Velvet Roll Roguelike Dice and Card Deckbuilder"></canvas>
<script type="module">
import { COLORS } from './src/config/colors.js';
import { EDITIONS } from './src/config/editions.js';
import { HANDS } from './src/config/hands.js';
import { CARD_CATALOG, CARD_BY_ID } from './src/config/cards.js';
import { VOUCHER_COST, VOUCHER_CATALOG } from './src/config/vouchers.js';
import {
  DICE_COUNT,
  MAX_DICE_COUNT,
  DICE_SIDES,
  MAX_SELECT_DICE,
  TITLE_DICE,
  FACE_MOD_META,
  DICE_UPGRADE_CATALOG,
  createPoolDie,
  createFreshDice
} from './src/config/dices.js';
import {
  lerp,
  addShake as engineAddShake,
  spawnPopup as engineSpawnPopup,
  spawnParticles as engineSpawnParticles,
  updateGraphicsEffects,
  drawParticlesAndPopups,
  drawCRTOverlay,
  drawHitFlash,
  drawTableBackground
} from './src/engines/graphicEngine.js';
import { sfx } from './src/engines/soundEngine.js';
import {
  fmtNum,
  fmtMult,
  drawLeftHUD,
  drawModifierCardTray,
  drawPlayArena,
  drawDieInspectorTooltip,
  drawCashOutPanel,
  drawShopArena,
  drawCardTooltip,
  drawTitleScreen,
  drawEndModal,
  drawOverlayModal
} from './src/engines/ui.js';
import {
  findHoveredDieIndex,
  initInputListeners
} from './src/engines/keyinputs.js';

(() => {
  'use strict';

  // =========================================================================
  // 1. CONSTANTS, THEME PALETTE & GAME DATA
  // =========================================================================
  const LOGICAL_W = 1280;
  const LOGICAL_H = 760;
  const BASE_MAX_SLOTS = 5;
  const BASE_HANDS = 4;
  const BASE_REROLLS = 3;
  const SHOP_REROLL_COST = 3;
  const MAX_INTEREST = 5;
  const STORAGE_KEY = 'velvet_roll_stats_v1';

  const STAGE_TARGETS = [
    300, 800, 2000,
    5500, 14000, 32000,
    75000, 175000, 420000
  ];

  const BOSS_MODIFIERS = [
    {
      id: 'EVEN_ZERO',
      name: 'The Even Drain',
      short: 'Even dice give 0 Chips',
      desc: 'All even dice (2, 4, 6, 8...) contribute 0 pip Chips when scored.'
    },
    {
      id: 'TWO_REROLLS',
      name: 'The Tight Grip',
      short: '-1 Reroll this chapter',
      desc: 'Start this chapter with 1 fewer Reroll than usual.'
    },
    {
      id: 'ODD_ZERO',
      name: 'The Odd Tax',
      short: 'Odd dice give 0 Chips',
      desc: 'All odd dice (1, 3, 5, 7...) contribute 0 pip Chips when scored.'
    },
    {
      id: 'DISABLE_FIRST',
      name: 'The Blind Eye',
      short: 'First card slot disabled',
      desc: 'Your leftmost modifier card is debuffed. Reorder cards to adapt!'
    },
    {
      id: 'THREE_HANDS',
      name: 'The Short Stack',
      short: '-1 Hand this chapter',
      desc: 'Start this chapter with 1 fewer Hand than usual.'
    },
    {
      id: 'MIN_TWO_DICE',
      name: 'The Heavy Felt',
      short: 'Must play at least 2 dice',
      desc: 'Single-die hands are blocked; select at least 2 dice to score.'
    }
  ];

  // =========================================================================
  // 2. HELPER FUNCTIONS (HAND EVAL WITH WILD RESOLUTION, EDITIONS, PERSISTENCE)
  // =========================================================================
  let nextUid = 1;

  function loadStats() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        return {
          bestHand: Number(parsed.bestHand) || 0,
          bestStage: Number(parsed.bestStage) || 0,
          wins: Number(parsed.wins) || 0
        };
      }
    } catch (_) {}
    return { bestHand: 0, bestStage: 0, wins: 0 };
  }

  function saveStats(stats) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(stats));
    } catch (_) {}
  }

  function getStageTarget(stage) {
    if (stage <= STAGE_TARGETS.length) return STAGE_TARGETS[stage - 1];
    let v = STAGE_TARGETS[STAGE_TARGETS.length - 1];
    for (let s = STAGE_TARGETS.length + 1; s <= stage; s++) {
      v = Math.round((v * 2.35) / 100) * 100;
    }
    return v;
  }

  function getStageLabel(stage) {
    if (stage % 3 === 0) return 'BOSS CURSE';
    if (stage % 3 === 2) return 'HIGH STAKES';
    return 'OPENING TABLE';
  }

  function getStageBaseReward(stage) {
    if (stage % 3 === 0) return 6;
    if (stage % 3 === 2) return 4;
    return 3;
  }

  function hasConsecutiveRun(values, runLen) {
    const uniq = [...new Set(values)].sort((a, b) => a - b);
    if (uniq.length < runLen) return false;
    let streak = 1;
    for (let i = 1; i < uniq.length; i++) {
      if (uniq[i] === uniq[i - 1] + 1) {
        streak++;
        if (streak >= runLen) return true;
      } else {
        streak = 1;
      }
    }
    return false;
  }

  // Concrete 1–4 dice hand evaluation
  function evaluateConcreteValues(diceValues) {
    if (!diceValues || diceValues.length === 0) return null;
    const sorted = [...diceValues].sort((a, b) => a - b);
    const counts = {};
    for (const v of sorted) counts[v] = (counts[v] || 0) + 1;
    const freqs = Object.values(counts).sort((a, b) => b - a);
    const countSixOrHigher = sorted.filter(v => v >= 6).length;

    if (freqs[0] >= 4) {
      return HANDS.FOUR_OF_A_KIND;
    }
    if (countSixOrHigher >= 3 && freqs[0] >= 3 && sorted.filter(v => v === sorted[sorted.length - 1]).length >= 3 && sorted[sorted.length - 1] >= 6) {
      return HANDS.PERFECT_18;
    }
    if (sorted.length >= 4 && hasConsecutiveRun(sorted, 4)) {
      return HANDS.LARGE_STRAIGHT;
    }
    if (freqs[0] >= 3) {
      return HANDS.THREE_OF_A_KIND;
    }
    if (freqs[0] >= 2 && (freqs[1] || 0) >= 2) {
      return HANDS.TWO_PAIR;
    }
    if (sorted.length >= 3 && hasConsecutiveRun(sorted, 3)) {
      return HANDS.SMALL_STRAIGHT;
    }
    if (freqs[0] >= 2) {
      return HANDS.PAIR;
    }
    return HANDS.HIGH_DIE;
  }

  function resolveDiceAndEvaluateHand(selectedDice) {
    if (!selectedDice || selectedDice.length === 0) return null;

    const wildIndices = [];
    const baseValues = selectedDice.map((d, idx) => {
      if (d.mod === 'wild') {
        wildIndices.push(idx);
      }
      return d.value;
    });

    if (wildIndices.length === 0) {
      for (const d of selectedDice) d.effectiveValue = d.value;
      return { hand: evaluateConcreteValues(baseValues), resolvedValues: baseValues };
    }

    const maxTableVal = Math.max(6, ...baseValues);
    const candidates = [];
    for (let v = 1; v <= maxTableVal; v++) candidates.push(v);

    let bestHand = null;
    let bestScoreMetric = -1;
    let bestResolved = [...baseValues];

    function search(wIdx, currentVals) {
      if (wIdx >= wildIndices.length) {
        const h = evaluateConcreteValues(currentVals);
        const pipSum = currentVals.reduce((a, b) => a + b, 0);
        const metric = (h.chips * h.mult) * 1000 + pipSum;
        if (metric > bestScoreMetric) {
          bestScoreMetric = metric;
          bestHand = h;
          bestResolved = [...currentVals];
        }
        return;
      }
      const targetPos = wildIndices[wIdx];
      for (const cand of candidates) {
        currentVals[targetPos] = cand;
        search(wIdx + 1, currentVals);
      }
    }

    search(0, [...baseValues]);
    selectedDice.forEach((d, idx) => {
      d.effectiveValue = bestResolved[idx];
    });
    return { hand: bestHand, resolvedValues: bestResolved };
  }

  function rollEdition() {
    const r = Math.random() * 100;
    if (r < 80) return 'standard';
    if (r < 88) return 'foil';
    if (r < 95) return 'holographic';
    if (r < 98) return 'polychrome';
    return 'negative';
  }

  function createCardInstance(cardId, forcedEdition = null) {
    const def = CARD_BY_ID[cardId];
    const edition = forcedEdition || rollEdition();
    const edDef = EDITIONS[edition];
    const rawPrice = def.basePrice + edDef.priceAdd;
    const price = Math.max(4, Math.min(8, rawPrice));
    const sellValue = Math.max(2, Math.floor(price / 2));
    return {
      uid: nextUid++,
      cardId: def.id,
      edition,
      price,
      sellValue,
      scalingBonus: 0,
      x: 0, y: 0,
      targetX: 0, targetY: 0,
      scale: 1,
      bounce: 0,
      tilt: 0,
      flash: 0,
      pulseColor: '#FFFFFF'
    };
  }

  // =========================================================================
  // 3. GAME STATE & ENGINE
  // =========================================================================
  const canvas = document.getElementById('game-canvas');
  const ctx = canvas.getContext('2d');

  const state = {
    mode: 'TITLE_MENU', // TITLE_MENU | PLAYING | SCORING | CASH_OUT | SHOP | VICTORY | GAME_OVER
    modal: null,        // null | 'PAUSE' | 'GUIDE' | 'WORKSHOP'
    crtEnabled: true,
    time: 0,
    stats: loadStats(),

    // Viewport transform
    vw: window.innerWidth,
    vh: window.innerHeight,
    dpr: Math.min(window.devicePixelRatio || 1, 2),
    scale: 1,
    ox: 0,
    oy: 0,

    // Run state
    stage: 1,
    endless: false,
    targetScore: 300,
    stageScore: 0,
    displayScore: 0,
    handsLeft: BASE_HANDS,
    rerollsLeft: BASE_REROLLS,
    money: 4,
    activeBoss: null,
    usedBossIds: [],
    bestHandScore: 0,
    totalMoneyEarned: 0,
    handsPlayedRun: 0,

    // Vouchers & Custom Dice Pool
    vouchers: {}, // { HEAVY_CUP: count, WIDE_GRIP: count, ... }
    dicePool: [], // Array of pool dice, each with 6 face objects: { value, mod }
    currentVoucherAnte: 0,
    shopVoucher: null,
    shopDiceUpgrades: [],
    workshopTarget: null, // { shopIdx, upgrade }
    workshopDieIdx: 0,

    // Live scoring display
    chips: 0,
    mult: 0,
    liveHandName: '',
    scoringHandTotal: 0,
    scoringBanner: '',
    scoringQueue: [],
    scoringTimer: 0,
    scoringStepCount: 0,
    pendingAfterScore: null,

    // Active rolled dice on the table
    dice: [],

    // Cards
    activeCards: [],
    shopCards: [],
    cashOutData: null,
    cashOutReveal: 0,

    // Title backdrop props
    titleDice: [],
    titleCards: [],

    // Interaction state
    mouseX: -999,
    mouseY: -999,
    hoveredCard: null,
    hoveredDieIdx: -1,
    focusedActiveUid: null,
    drag: null,
    buttons: [],
    hoverButtonId: null,
    noticeText: '',
    noticeTimer: 0,

    // Juice (particles, popups, screen shake, flash)
    particles: [],
    popups: [],
    shakeMag: 0,
    hitFlash: 0,
    scoreTickAccum: 0
  };

  function getVoucherStacks(id) {
    return (state.vouchers && state.vouchers[id]) || 0;
  }

  function getMaxSelectDice() {
    return MAX_SELECT_DICE + (getVoucherStacks('WIDE_GRIP') > 0 ? 1 : 0);
  }

  function getStageMaxHands() {
    const base = BASE_HANDS + getVoucherStacks('EXTRA_SLEEVE');
    return (state.activeBoss && state.activeBoss.id === 'THREE_HANDS') ? Math.max(1, base - 1) : base;
  }

  function getStageMaxRerolls() {
    const base = BASE_REROLLS + getVoucherStacks('LOADED_WRIST');
    return (state.activeBoss && state.activeBoss.id === 'TWO_REROLLS') ? Math.max(0, base - 1) : base;
  }

  function getBaseCardSlots() {
    return BASE_MAX_SLOTS + getVoucherStacks('CARD_SHARK');
  }

  function getMaxCardSlots() {
    let negs = 0;
    for (const c of state.activeCards) {
      if (c.edition === 'negative') negs++;
    }
    return getBaseCardSlots() + negs;
  }

  function getUsedCardSlots() {
    let count = 0;
    for (const c of state.activeCards) {
      if (c.edition !== 'negative') count++;
    }
    return count;
  }

  function getShopCardSlotCount() {
    return 3 + (getVoucherStacks('VIP_PASS') > 0 ? 1 : 0);
  }

  function showNotice(text, dur = 1.6) {
    state.noticeText = text;
    state.noticeTimer = dur;
  }

  function addShake(amount) {
    engineAddShake(state, amount);
  }

  function spawnPopup(x, y, text, color = '#FFFFFF', size = 22) {
    engineSpawnPopup(state, x, y, text, color, size);
  }

  function spawnParticles(x, y, count, palette, speedMin = 80, speedMax = 300) {
    engineSpawnParticles(state, x, y, count, palette, speedMin, speedMax);
  }

  function initTitleBackdrop() {
    state.titleDice = TITLE_DICE.map(d => ({ ...d }));
    state.titleCards = [
      createCardInstance('KS', 'foil'),
      createCardInstance('AH', 'holographic'),
      createCardInstance('KD', 'polychrome'),
      createCardInstance('QH', 'negative'),
      createCardInstance('7D', 'standard')
    ];
  }

  // =========================================================================
  // 4. RUN & STAGE FLOW LOGIC
  // =========================================================================
  function startNewRun() {
    sfx.unlock();
    sfx.buyCard();
    state.stage = 1;
    state.endless = false;
    state.money = 4;
    state.vouchers = {};
    state.dicePool = Array.from({ length: DICE_COUNT }, (_, i) => createPoolDie(i));
    state.currentVoucherAnte = 0;
    state.shopVoucher = null;
    state.shopDiceUpgrades = [];
    state.workshopTarget = null;
    state.workshopDieIdx = 0;
    state.activeCards = [];
    state.shopCards = [];
    state.usedBossIds = [];
    state.bestHandScore = 0;
    state.totalMoneyEarned = 0;
    state.handsPlayedRun = 0;
    state.modal = null;
    state.focusedActiveUid = null;
    state.drag = null;
    startStage(1);
  }

  function startStage(stageNum) {
    state.stage = stageNum;
    state.targetScore = getStageTarget(stageNum);
    state.stageScore = 0;
    state.displayScore = 0;
    state.scoringHandTotal = 0;
    state.scoringQueue = [];
    state.scoringBanner = '';
    state.mode = 'PLAYING';
    state.modal = null;
    state.workshopTarget = null;
    state.focusedActiveUid = null;

    // Assign Boss every 3rd stage
    if (stageNum % 3 === 0) {
      let pool = BOSS_MODIFIERS.filter(b => !state.usedBossIds.includes(b.id));
      if (pool.length === 0) {
        state.usedBossIds = [];
        pool = BOSS_MODIFIERS;
      }
      const boss = pool[Math.floor(Math.random() * pool.length)];
      state.activeBoss = boss;
      state.usedBossIds.push(boss.id);
      sfx.bossIntro();
      showNotice('BOSS CURSE: ' + boss.name + ' — ' + boss.short, 2.8);
    } else {
      state.activeBoss = null;
    }

    state.handsLeft = getStageMaxHands();
    state.rerollsLeft = getStageMaxRerolls();

    state.dice = createFreshDice(state.dicePool);
    sfx.diceRoll(state.dice.length);
    updateLivePreview();
  }

  function rollDiceSet(indicesToRoll) {
    if (indicesToRoll.length === 0) return;
    sfx.diceRoll(indicesToRoll.length);
    for (let k = 0; k < indicesToRoll.length; k++) {
      const d = state.dice[indicesToRoll[k]];
      const faceIdx = Math.floor(Math.random() * DICE_SIDES);
      const face = d.faces[faceIdx];
      d.faceIndex = faceIdx;
      d.value = face.value;
      d.mod = face.mod;
      d.effectiveValue = face.value;
      d.y = d.targetY - 90 - Math.random() * 45;
      d.vy = -120 - Math.random() * 80;
      d.angle = (Math.random() - 0.5) * 1.6;
      d.vAngle = (Math.random() > 0.5 ? 1 : -1) * (10 + Math.random() * 9);
      d.tumbleTimer = 0.36 + k * 0.05;
      d.flickerTimer = 0;
      d.scale = 1.12;
      spawnParticles(d.x, d.targetY + 25, 5, ['rgba(247,243,232,0.7)', COLORS.brassBright], 40, 110);
    }
    updateLivePreview();
  }

  function isAnyDieTumbling() {
    return state.dice.some(d => d.tumbleTimer > 0.02);
  }

  function toggleDieSelection(idx) {
    if (state.mode !== 'PLAYING' || state.modal) return;
    const d = state.dice[idx];
    if (!d) return;
    const maxSelect = getMaxSelectDice();
    if (d.selected) {
      d.selected = false;
      d.effectiveValue = d.value;
      d.scale = 0.92;
      sfx.dieSelect(false);
    } else {
      const curSelected = state.dice.filter(x => x.selected).length;
      if (curSelected >= maxSelect) {
        sfx.error();
        showNotice(`Maximum ${maxSelect} dice per hand — deselect one first`, 1.4);
        d.scale = 0.9;
        return;
      }
      d.selected = true;
      d.scale = 1.12;
      sfx.dieSelect(true);
    }
    updateLivePreview();
  }

  function clearSelectedDice() {
    if (state.mode !== 'PLAYING' || state.modal) return;
    let changed = false;
    for (const d of state.dice) {
      if (d.selected) {
        d.selected = false;
        d.effectiveValue = d.value;
        changed = true;
      }
    }
    if (changed) {
      sfx.dieSelect(false);
      updateLivePreview();
    }
  }

  function triggerReroll() {
    if (state.mode !== 'PLAYING' || state.modal || isAnyDieTumbling()) return;
    if (state.rerollsLeft <= 0) {
      sfx.error();
      showNotice('No Rerolls remaining this chapter', 1.4);
      return;
    }
    const unselected = [];
    for (let i = 0; i < state.dice.length; i++) {
      if (!state.dice[i].selected) unselected.push(i);
    }
    if (unselected.length === 0) {
      sfx.error();
      showNotice('Unlock at least one die to reroll', 1.4);
      return;
    }
    state.rerollsLeft--;
    rollDiceSet(unselected);
  }

  function updateLivePreview() {
    if (state.mode === 'SCORING') return;
    const selected = state.dice.filter(d => d.selected);
    if (selected.length === 0) {
      state.liveHandName = '';
      state.chips = 0;
      state.mult = 0;
      return;
    }
    const { hand } = resolveDiceAndEvaluateHand(selected);
    state.liveHandName = hand.name;
    state.chips = hand.chips;
    state.mult = hand.mult;
  }

  // =========================================================================
  // 5. DETERMINISTIC SCORING PIPELINE (BASE -> DICE & FACE MODS -> CARDS)
  // =========================================================================
  function isDieDebuffedByBoss(val) {
    if (!state.activeBoss) return false;
    if (state.activeBoss.id === 'EVEN_ZERO' && val % 2 === 0) return true;
    if (state.activeBoss.id === 'ODD_ZERO' && val % 2 === 1) return true;
    return false;
  }

  function isCardDebuffedByBoss(cardIndex) {
    return Boolean(state.activeBoss && state.activeBoss.id === 'DISABLE_FIRST' && cardIndex === 0);
  }

  function playSelectedHand() {
    if (state.mode !== 'PLAYING' || state.modal || isAnyDieTumbling()) return;
    const playedDice = state.dice.filter(d => d.selected);
    const maxSelect = getMaxSelectDice();
    if (playedDice.length === 0) {
      sfx.error();
      showNotice(`Select 1 to ${maxSelect} dice to score a hand`, 1.5);
      return;
    }
    if (state.activeBoss && state.activeBoss.id === 'MIN_TWO_DICE' && playedDice.length < 2) {
      sfx.error();
      showNotice('The Heavy Felt requires at least 2 dice!', 1.8);
      return;
    }

    const { hand } = resolveDiceAndEvaluateHand(playedDice);
    state.handsLeft--;
    state.handsPlayedRun++;
    state.mode = 'SCORING';
    state.focusedActiveUid = null;
    state.drag = null;

    // Create scoring proxies using resolved effectiveValue (so Wild faces count as their optimal value for cards too)
    const playedProxies = playedDice.map(d => ({
      id: d.id,
      value: d.effectiveValue || d.value,
      mod: d.mod,
      dieRef: d
    }));

    const steps = [];
    const playedSum = playedProxies.reduce((acc, d) => acc + d.value, 0);
    const unplayedCount = state.dice.length - playedDice.length;

    // Step 0: Base hand ignition
    steps.push({
      type: 'BASE_HAND',
      hand,
      duration: 0.42
    });

    // Determine active retrigger cards (ignoring boss-debuffed slot 0)
    const retriggerFirstCards = [];
    const retriggerSixCards = [];
    state.activeCards.forEach((inst, idx) => {
      if (isCardDebuffedByBoss(idx)) return;
      const def = CARD_BY_ID[inst.cardId];
      if (def.retriggerFirst) retriggerFirstCards.push(inst);
      if (def.retriggerSix) retriggerSixCards.push(inst);
    });

    // Helper to enqueue a die's pip scoring + its face mod trigger
    function enqueueDieScoring(proxy, retriggerCard = null) {
      const die = proxy.dieRef;
      const scoredValue = proxy.value;
      const debuffed = isDieDebuffedByBoss(scoredValue);

      steps.push({
        type: 'DIE_SCORE',
        die,
        scoredValue,
        debuffed,
        retriggerCard,
        duration: 0.28
      });

      // Trigger face modification immediately after pip value if face has a mod
      if (die.mod && die.mod !== 'wild') {
        steps.push({
          type: 'DIE_FACE_MOD',
          die,
          mod: die.mod,
          duration: 0.32
        });
      }
    }

    // Step 1: Score each played die left-to-right (+ face mods + retriggers)
    const scoredDiceLog = [];
    playedProxies.forEach((proxy, idx) => {
      scoredDiceLog.push(proxy);
      enqueueDieScoring(proxy, null);

      // Retrigger first die via Jack of Clubs
      if (idx === 0) {
        for (const rc of retriggerFirstCards) {
          scoredDiceLog.push(proxy);
          enqueueDieScoring(proxy, rc);
        }
      }
      // Retrigger 6s via 6 of Spades
      if (proxy.value === 6) {
        for (const rc of retriggerSixCards) {
          scoredDiceLog.push(proxy);
          enqueueDieScoring(proxy, rc);
        }
      }
    });

    // Step 2: Modifier cards left to right
    const evalCtx = {
      hand,
      playedDice: playedProxies,
      scoredDice: scoredDiceLog,
      playedSum,
      unplayedCount,
      rerollsLeft: state.rerollsLeft,
      handsLeftAfterPlay: state.handsLeft,
      money: state.money
    };

    state.activeCards.forEach((inst, idx) => {
      const def = CARD_BY_ID[inst.cardId];
      if (isCardDebuffedByBoss(idx)) {
        steps.push({
          type: 'CARD_DEBUFFED',
          card: inst,
          duration: 0.30
        });
        return;
      }

      const cardEvents = def.evaluate(inst, evalCtx);
      for (const ev of cardEvents) {
        steps.push({
          type: 'CARD_EVENT',
          card: inst,
          def,
          ev,
          duration: cardEvents.length > 2 ? 0.25 : 0.34
        });
      }

      // Edition scoring trigger (Foil, Holographic, Polychrome)
      if (inst.edition === 'foil') {
        steps.push({
          type: 'EDITION_EVENT',
          card: inst,
          edition: 'foil',
          chipsAdd: 50,
          label: 'Foil +50',
          color: COLORS.chipsLight,
          sfx: 'chips',
          duration: 0.30
        });
      } else if (inst.edition === 'holographic') {
        steps.push({
          type: 'EDITION_EVENT',
          card: inst,
          edition: 'holographic',
          multAdd: 12,
          label: 'Holo +12M',
          color: '#F472B6',
          sfx: 'mult',
          duration: 0.30
        });
      } else if (inst.edition === 'polychrome') {
        steps.push({
          type: 'EDITION_EVENT',
          card: inst,
          edition: 'polychrome',
          multMul: 1.5,
          label: 'Poly x1.5',
          color: '#C084FC',
          sfx: 'xmult',
          duration: 0.34
        });
      }
    });

    // Step 3: Slam total into stage score
    steps.push({
      type: 'TOTAL_SLAM',
      duration: 0.95
    });

    state.scoringQueue = steps;
    state.scoringTimer = 0.05;
    state.scoringStepCount = 0;
    state.scoringHandTotal = 0;
    state.liveHandName = hand.name;
    state.chips = hand.chips;
    state.mult = hand.mult;
  }

  function executeScoringStep(step) {
    if (step.type === 'BASE_HAND') {
      state.chips = step.hand.chips;
      state.mult = step.hand.mult;
      state.scoringBanner = step.hand.name + '  (' + step.hand.chips + ' × ' + step.hand.mult + ')';
      sfx.scoreStep(0, 'chips');
      spawnPopup(640, 140, step.hand.name + '!', COLORS.brassBright, 20);
      return;
    }

    if (step.type === 'DIE_SCORE') {
      const d = step.die;
      const val = step.scoredValue;
      d.hop = 1;
      if (step.retriggerCard) {
        step.retriggerCard.bounce = 1;
        step.retriggerCard.flash = 1;
        step.retriggerCard.pulseColor = COLORS.goldLight;
        spawnPopup(step.retriggerCard.x, step.retriggerCard.y - 36, 'Retrigger!', COLORS.goldLight, 18);
        sfx.scoreStep(state.scoringStepCount, 'retrigger');
      }
      if (step.debuffed) {
        d.flash = 1;
        d.flashColor = COLORS.multRed;
        state.scoringBanner = state.activeBoss.name + ' blocked ' + val + '!';
        spawnPopup(d.x, d.y - 68, '0 (Curse)', COLORS.multLight, 20);
        sfx.scoreStep(state.scoringStepCount, 'debuff');
      } else {
        state.chips += val;
        d.flash = 1;
        d.flashColor = COLORS.chipsLight;
        state.scoringStepCount++;
        const wildNote = d.mod === 'wild' ? ` (★Wild=${val})` : '';
        state.scoringBanner = `Die #${d.id + 1}${wildNote}  →  +${val} Base`;
        spawnPopup(d.x, d.y - 68, '+' + val, COLORS.chipsLight, 24);
        spawnParticles(d.x, d.y - 10, 8, [COLORS.chipsLight, '#FFFFFF'], 50, 140);
        sfx.scoreStep(state.scoringStepCount, 'chips');
      }
      return;
    }

    if (step.type === 'DIE_FACE_MOD') {
      const d = step.die;
      const mod = step.mod;
      const mm = FACE_MOD_META[mod];
      if (!mm) return;

      d.hop = 1.15;
      d.flash = 1;
      d.flashColor = mm.color;
      state.scoringStepCount++;

      if (mod === 'mult') {
        state.mult += 15;
        state.scoringBanner = `Die #${d.id + 1} Ruby Inlay  →  +15 Mult`;
        spawnPopup(d.x, d.y - 82, '+15 Mult', mm.color, 23);
        spawnParticles(d.x, d.y - 15, 14, [mm.color, '#FFFFFF'], 70, 190);
        sfx.scoreStep(state.scoringStepCount, 'mult');
      } else if (mod === 'chips') {
        state.chips += 50;
        state.scoringBanner = `Die #${d.id + 1} Sapphire Inlay  →  +50 Base`;
        spawnPopup(d.x, d.y - 82, '+50 Base', mm.color, 23);
        spawnParticles(d.x, d.y - 15, 14, [mm.color, '#FFFFFF'], 70, 190);
        sfx.scoreStep(state.scoringStepCount, 'chips');
      } else if (mod === 'gold') {
        state.money += 3;
        state.totalMoneyEarned += 3;
        state.scoringBanner = `Die #${d.id + 1} Gold Leaf  →  +$3`;
        spawnPopup(d.x, d.y - 82, '+$3', mm.color, 24);
        spawnPopup(985, 65, '+$3', COLORS.goldLight, 20);
        spawnParticles(d.x, d.y - 15, 16, [mm.color, COLORS.gold, '#FFFFFF'], 70, 200);
        sfx.scoreStep(state.scoringStepCount, 'money');
      } else if (mod === 'glass') {
        state.mult = Math.round(state.mult * 2 * 100) / 100;
        addShake(5);
        // 25% chance to shatter (reverting mod back to null)
        const shattered = Math.random() < 0.25;
        if (shattered) {
          d.mod = null;
          if (d.faces && d.faces[d.faceIndex]) {
            d.faces[d.faceIndex].mod = null;
          }
          state.scoringBanner = `Die #${d.id + 1} Glass Face  →  x2 Mult (SHATTERED!)`;
          spawnPopup(d.x, d.y - 88, 'x2 & SHATTER!', '#FCA5A5', 24);
          spawnParticles(d.x, d.y - 15, 28, ['#A5F3FC', '#FFFFFF', '#F87171'], 100, 280);
          sfx.error();
        } else {
          state.scoringBanner = `Die #${d.id + 1} Glass Face  →  x2 Mult`;
          spawnPopup(d.x, d.y - 82, 'x2 Mult', mm.color, 26);
          spawnParticles(d.x, d.y - 15, 18, [mm.color, '#FFFFFF'], 80, 220);
          sfx.scoreStep(state.scoringStepCount, 'xmult');
        }
      }
      return;
    }

    if (step.type === 'CARD_DEBUFFED') {
      const c = step.card;
      c.bounce = 0.6;
      c.flash = 1;
      c.pulseColor = COLORS.multRed;
      state.scoringBanner = 'Leftmost card disabled by ' + state.activeBoss.name;
      spawnPopup(c.x, c.y - 48, 'Debuffed', COLORS.multLight, 19);
      sfx.scoreStep(state.scoringStepCount, 'debuff');
      return;
    }

    if (step.type === 'CARD_EVENT') {
      const c = step.card;
      const ev = step.ev;
      c.bounce = 1;
      c.flash = 1;
      c.pulseColor = ev.color;
      state.scoringStepCount++;

      if (ev.dieId !== undefined) {
        const d = state.dice[ev.dieId];
        if (d) {
          d.hop = 0.7;
          d.flash = 0.8;
          d.flashColor = ev.color;
        }
      }
      if (ev.scaleAdd) {
        c.scalingBonus = (c.scalingBonus || 0) + ev.scaleAdd;
      }
      if (ev.chipsAdd) state.chips += ev.chipsAdd;
      if (ev.multAdd) state.mult += ev.multAdd;
      if (ev.multMul) state.mult = Math.round(state.mult * ev.multMul * 100) / 100;
      if (ev.moneyAdd) {
        state.money += ev.moneyAdd;
        state.totalMoneyEarned += ev.moneyAdd;
      }

      state.scoringBanner = step.def.name + '  →  ' + ev.label;
      spawnPopup(c.x, c.y - 52, ev.label, ev.color, ev.multMul ? 26 : 22);
      spawnParticles(c.x, c.y, ev.multMul ? 18 : 10, [ev.color, '#FFFFFF', COLORS.brassBright], 70, 210);
      if (ev.multMul) addShake(5);
      sfx.scoreStep(state.scoringStepCount, ev.sfx || 'mult');
      return;
    }

    if (step.type === 'EDITION_EVENT') {
      const c = step.card;
      c.bounce = 1.15;
      c.flash = 1;
      c.pulseColor = step.color;
      state.scoringStepCount++;
      if (step.chipsAdd) state.chips += step.chipsAdd;
      if (step.multAdd) state.mult += step.multAdd;
      if (step.multMul) state.mult = Math.round(state.mult * step.multMul * 100) / 100;

      state.scoringBanner = EDITIONS[step.edition].name + ' Edition  →  ' + step.label;
      spawnPopup(c.x, c.y - 60, step.label, step.color, 23);
      spawnParticles(c.x, c.y, 16, [step.color, '#FFFFFF', '#FDE047'], 80, 230);
      if (step.multMul) addShake(6);
      sfx.scoreStep(state.scoringStepCount, step.sfx);
      return;
    }

    if (step.type === 'TOTAL_SLAM') {
      const handTotal = Math.round(state.chips * state.mult);
      state.scoringHandTotal = handTotal;
      state.stageScore += handTotal;
      if (handTotal > state.bestHandScore) state.bestHandScore = handTotal;

      if (handTotal > state.stats.bestHand) {
        state.stats.bestHand = handTotal;
        saveStats(state.stats);
      }

      const beatTarget = state.stageScore >= state.targetScore;
      const hugeBlowout = handTotal >= state.targetScore;

      state.scoringBanner = fmtNum(state.chips) + ' × ' + fmtMult(state.mult) + ' = ' + fmtNum(handTotal) + (beatTarget ? '  —  CHAPTER CLEARED!' : '');
      spawnPopup(640, 310, '+' + fmtNum(handTotal), beatTarget ? COLORS.goldLight : '#FFFFFF', hugeBlowout ? 44 : 34);

      if (beatTarget) {
        addShake(hugeBlowout ? 18 : 11);
        state.hitFlash = hugeBlowout ? 0.55 : 0.3;
        spawnParticles(640, 340, hugeBlowout ? 75 : 45, [COLORS.goldLight, COLORS.emerald, COLORS.chipsLight, '#FFFFFF'], 120, 420);
        spawnParticles(480, 60, 30, [COLORS.goldLight, COLORS.emerald], 80, 260);
      } else {
        addShake(4);
        spawnParticles(640, 340, 18, [COLORS.chipsLight, COLORS.multLight, '#FFFFFF'], 80, 200);
      }
      sfx.totalSlam(beatTarget);

      if (beatTarget) {
        if (state.stage > state.stats.bestStage) {
          state.stats.bestStage = state.stage;
          saveStats(state.stats);
        }
        state.pendingAfterScore = 'CASH_OUT';
      } else if (state.handsLeft <= 0) {
        state.pendingAfterScore = 'GAME_OVER';
      } else {
        state.pendingAfterScore = 'NEXT_HAND';
      }
    }
  }

  function finishScoringPhase() {
    const next = state.pendingAfterScore;
    state.pendingAfterScore = null;
    state.scoringBanner = '';

    if (next === 'CASH_OUT') {
      const baseReward = getStageBaseReward(state.stage);
      const handsBonus = state.handsLeft;
      const interest = Math.min(MAX_INTEREST, Math.floor(state.money / 5));
      const total = baseReward + handsBonus + interest;
      state.cashOutData = {
        baseReward,
        handsBonus,
        handsCount: state.handsLeft,
        interest,
        total,
        claimed: false,
        isRunVictory: state.stage === 9 && !state.endless
      };
      state.cashOutReveal = 0;
      state.mode = 'CASH_OUT';
      sfx.sellCard();
    } else if (next === 'GAME_OVER') {
      state.mode = 'GAME_OVER';
      sfx.gameOver();
    } else {
      state.mode = 'PLAYING';
      const allIndices = [];
      for (let i = 0; i < state.dice.length; i++) {
        state.dice[i].selected = false;
        allIndices.push(i);
      }
      rollDiceSet(allIndices);
    }
  }

  // =========================================================================
  // 6. CASH-OUT, BAZAAR, VOUCHERS & DICE WORKSHOP
  // =========================================================================
  function claimCashOut() {
    if (state.mode !== 'CASH_OUT' || !state.cashOutData) return;
    if (!state.cashOutData.claimed) {
      state.cashOutData.claimed = true;
      state.money += state.cashOutData.total;
      state.totalMoneyEarned += state.cashOutData.total;
      sfx.buyCard();
      spawnPopup(985, 65, '+$' + state.cashOutData.total, COLORS.goldLight, 26);
    }

    if (state.cashOutData.isRunVictory) {
      state.stats.wins = (state.stats.wins || 0) + 1;
      state.stats.bestStage = Math.max(state.stats.bestStage, 9);
      saveStats(state.stats);
      state.mode = 'VICTORY';
      sfx.victory();
      spawnParticles(640, 320, 80, [COLORS.goldLight, COLORS.emerald, COLORS.chipsLight, '#F472B6'], 120, 420);
      return;
    }

    enterShop();
  }

  function rollAnteVoucherIfNeeded() {
    // Refreshes once per Ante (every 3 stages: Stages 1-3 = Ante 1, Stages 4-6 = Ante 2, Stages 7-9 = Ante 3...)
    const ante = Math.floor((state.stage - 1) / 3) + 1;
    if (state.currentVoucherAnte === ante && state.shopVoucher) {
      return;
    }
    state.currentVoucherAnte = ante;

    const available = VOUCHER_CATALOG.filter(v => {
      const stacks = getVoucherStacks(v.id);
      if (stacks >= v.maxStacks) return false;
      if (v.id === 'HEAVY_CUP' && state.dicePool.length >= MAX_DICE_COUNT) return false;
      return true;
    });

    if (available.length === 0) {
      state.shopVoucher = null;
      return;
    }
    const chosen = available[Math.floor(Math.random() * available.length)];
    state.shopVoucher = { ...chosen, purchased: false };
  }

  function rollWorkshopUpgrades() {
    const shuffled = [...DICE_UPGRADE_CATALOG];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    state.shopDiceUpgrades = shuffled.slice(0, 2).map(u => ({ ...u }));
  }

  function enterShop() {
    state.mode = 'SHOP';
    state.modal = null;
    state.workshopTarget = null;
    state.focusedActiveUid = null;
    rollAnteVoucherIfNeeded();
    rollShopInventory();
  }

  function rollShopInventory() {
    const slotCount = getShopCardSlotCount();
    const ownedIds = new Set(state.activeCards.map(c => c.cardId));
    let pool = CARD_CATALOG.filter(c => !ownedIds.has(c.id));
    if (pool.length < slotCount) pool = [...CARD_CATALOG];

    const shuffled = [...pool];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }

    state.shopCards = shuffled.slice(0, slotCount).map(def => createCardInstance(def.id));
    rollWorkshopUpgrades();
    sfx.cardSnap();
  }

  function rerollShop() {
    if (state.mode !== 'SHOP' || state.modal) return;
    if (state.money < SHOP_REROLL_COST) {
      sfx.error();
      showNotice('Need $' + SHOP_REROLL_COST + ' to refresh the Bazaar', 1.4);
      return;
    }
    state.money -= SHOP_REROLL_COST;
    spawnPopup(985, 65, '-$' + SHOP_REROLL_COST, COLORS.multLight, 22);
    rollShopInventory();
  }

  function buyShopVoucher() {
    if (state.mode !== 'SHOP' || state.modal) return;
    const v = state.shopVoucher;
    if (!v || v.purchased) return;
    if (state.money < VOUCHER_COST) {
      sfx.error();
      showNotice(`Need $${VOUCHER_COST} to redeem Voucher`, 1.4);
      return;
    }

    state.money -= VOUCHER_COST;
    v.purchased = true;
    state.vouchers[v.id] = getVoucherStacks(v.id) + 1;

    // Immediate run parameter application
    if (v.id === 'HEAVY_CUP' && state.dicePool.length < MAX_DICE_COUNT) {
      state.dicePool.push(createPoolDie(state.dicePool.length));
    } else if (v.id === 'VIP_PASS') {
      // Immediately add the 4th card slot in the current shop
      const existingIds = new Set([
        ...state.activeCards.map(c => c.cardId),
        ...state.shopCards.filter(Boolean).map(c => c.cardId)
      ]);
      const extraPool = CARD_CATALOG.filter(c => !existingIds.has(c.id));
      const pick = extraPool.length > 0
        ? extraPool[Math.floor(Math.random() * extraPool.length)]
        : CARD_CATALOG[Math.floor(Math.random() * CARD_CATALOG.length)];
      state.shopCards.push(createCardInstance(pick.id));
    }

    sfx.buyCard();
    spawnPopup(985, 65, '-$' + VOUCHER_COST, COLORS.goldLight, 22);
    spawnPopup(140, 300, v.name + ' Unlocked!', v.color, 24);
    spawnParticles(140, 330, 32, [v.color, COLORS.goldLight, '#FFFFFF'], 90, 260);
    showNotice(`Redeemed ${v.name}: ${v.desc}`, 2.4);
  }

  function openWorkshopModal(shopIdx) {
    if (state.mode !== 'SHOP' || state.modal) return;
    const upg = state.shopDiceUpgrades[shopIdx];
    if (!upg) return;
    if (state.money < upg.price) {
      sfx.error();
      showNotice(`Need $${upg.price} for ${upg.name}`, 1.4);
      return;
    }
    sfx.click();
    state.workshopTarget = { shopIdx, upgrade: upg };
    state.workshopDieIdx = 0;
    state.modal = 'WORKSHOP';
  }

  function applyWorkshopUpgrade(shopIdx, dieIdx, faceIdx) {
    const upg = state.shopDiceUpgrades[shopIdx];
    const targetDie = state.dicePool[dieIdx];
    if (!upg || !targetDie || !targetDie.faces[faceIdx]) return;
    if (state.money < upg.price) {
      sfx.error();
      return;
    }

    state.money -= upg.price;
    const face = targetDie.faces[faceIdx];
    if (upg.type === 'value_add') {
      face.value += upg.valueAdd;
    } else if (upg.type === 'mod') {
      face.mod = upg.mod;
    }

    state.shopDiceUpgrades[shopIdx] = null;
    state.modal = null;
    state.workshopTarget = null;

    sfx.buyCard();
    spawnPopup(985, 65, '-$' + upg.price, COLORS.goldLight, 22);
    spawnPopup(920, 320, `Die #${dieIdx + 1} Face #${faceIdx + 1} Forged!`, upg.color, 22);
    spawnParticles(920, 340, 26, [upg.color, COLORS.goldLight, '#FFFFFF'], 80, 240);
    showNotice(`Applied ${upg.name} to Die #${dieIdx + 1} (Face #${faceIdx + 1})!`, 2.2);
  }

  function buyShopCard(shopIdx) {
    if (state.mode !== 'SHOP' || state.modal) return;
    const card = state.shopCards[shopIdx];
    if (!card) return;
    if (state.money < card.price) {
      sfx.error();
      showNotice('Not enough money ($' + card.price + ' required)', 1.4);
      return;
    }
    const isNeg = card.edition === 'negative';
    if (!isNeg && state.activeCards.length >= getMaxCardSlots()) {
      sfx.error();
      showNotice('Card dock full — sell a card first!', 1.6);
      return;
    }

    state.money -= card.price;
    state.shopCards[shopIdx] = null;
    card.bounce = 1.2;
    card.flash = 1;
    card.pulseColor = EDITIONS[card.edition].color;
    state.activeCards.push(card);
    sfx.buyCard();
    spawnPopup(985, 65, '-$' + card.price, COLORS.goldLight, 22);
    spawnParticles(640, 640, 20, [COLORS.goldLight, EDITIONS[card.edition].color, '#FFFFFF'], 70, 220);
  }

  function sellActiveCard(idx) {
    if ((state.mode !== 'PLAYING' && state.mode !== 'SHOP') || state.modal) return;
    const card = state.activeCards[idx];
    if (!card) return;

    const val = card.sellValue;
    spawnPopup(card.x, card.y, '+$' + val, COLORS.goldLight, 24);
    spawnParticles(card.x, card.y, 14, [COLORS.goldLight, '#FFFFFF'], 60, 170);
    state.activeCards.splice(idx, 1);
    state.money += val;
    state.totalMoneyEarned += val;
    state.focusedActiveUid = null;
    sfx.sellCard();
  }

  function moveActiveCard(idx, delta) {
    if ((state.mode !== 'PLAYING' && state.mode !== 'SHOP') || state.modal) return;
    const target = idx + delta;
    if (target < 0 || target >= state.activeCards.length) return;
    const tmp = state.activeCards[idx];
    state.activeCards[idx] = state.activeCards[target];
    state.activeCards[target] = tmp;
    tmp.bounce = 0.7;
    sfx.cardSnap();
  }

  // =========================================================================
  // 7. SIMULATION UPDATE LOOP (CLAMPED DELTA TIME <= 0.05s)
  // =========================================================================
  function update(dt) {
    state.time += dt;

    if (state.noticeTimer > 0) state.noticeTimer = Math.max(0, state.noticeTimer - dt);

    if (state.displayScore < state.stageScore) {
      const diff = state.stageScore - state.displayScore;
      const step = Math.max(12, diff * Math.min(1, dt * 11));
      state.displayScore = Math.min(state.stageScore, state.displayScore + step);
      state.scoreTickAccum += dt;
      if (state.scoreTickAccum >= 0.045) {
        state.scoreTickAccum = 0;
        sfx.scoreTick();
      }
    } else if (state.displayScore > state.stageScore) {
      state.displayScore = state.stageScore;
    }

    for (const d of state.dice) {
      if (d.tumbleTimer > 0) {
        d.tumbleTimer = Math.max(0, d.tumbleTimer - dt);
        d.vy += 1850 * dt;
        d.y += d.vy * dt;
        d.angle += d.vAngle * dt;
        if (d.y >= d.targetY) {
          d.y = d.targetY;
          d.vy = -Math.abs(d.vy) * 0.42;
          d.vAngle *= 0.6;
        }
        if (d.tumbleTimer === 0) {
          d.y = d.targetY;
          d.vy = 0;
          d.angle = 0;
          d.vAngle = 0;
        }
      } else {
        d.y = lerp(d.y, d.targetY, Math.min(1, dt * 16));
        d.angle = lerp(d.angle, 0, Math.min(1, dt * 16));
      }
      d.scale = lerp(d.scale, 1, Math.min(1, dt * 14));
      d.hop = Math.max(0, d.hop - dt * 3.4);
      d.flash = Math.max(0, d.flash - dt * 3.2);
    }

    for (const c of state.activeCards) {
      if (!(state.drag && state.drag.active && state.drag.card === c)) {
        c.x = lerp(c.x, c.targetX, Math.min(1, dt * 15));
        c.y = lerp(c.y, c.targetY, Math.min(1, dt * 15));
      }
      c.bounce = Math.max(0, c.bounce - dt * 3.8);
      c.flash = Math.max(0, c.flash - dt * 2.8);
    }

    if (state.mode === 'SCORING' && !state.modal) {
      state.scoringTimer -= dt;
      if (state.scoringTimer <= 0) {
        if (state.scoringQueue.length > 0) {
          const nextStep = state.scoringQueue.shift();
          executeScoringStep(nextStep);
          state.scoringTimer = nextStep.duration;
        } else {
          finishScoringPhase();
        }
      }
    }

    if (state.mode === 'CASH_OUT') {
      state.cashOutReveal = Math.min(1.2, state.cashOutReveal + dt * 1.45);
    }

    updateGraphicsEffects(state, dt);
  }

  const uiCtx = {
    LOGICAL_W,
    LOGICAL_H,
    BASE_MAX_SLOTS,
    SHOP_REROLL_COST,
    MAX_INTEREST,
    getStageLabel,
    getStageTarget,
    getUsedCardSlots,
    getBaseCardSlots,
    getMaxCardSlots,
    getMaxSelectDice,
    getStageMaxHands,
    getStageMaxRerolls,
    getShopCardSlotCount,
    isDieDebuffedByBoss,
    isCardDebuffedByBoss,
    isAnyDieTumbling,
    startNewRun,
    startStage,
    enterShop,
    playSelectedHand,
    triggerReroll,
    clearSelectedDice,
    claimCashOut,
    buyShopCard,
    buyShopVoucher,
    openWorkshopModal,
    applyWorkshopUpgrade,
    rerollShop,
    moveActiveCard,
    sellActiveCard
  };

  function render() {
    ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
    drawTableBackground(ctx, state);

    state.buttons = [];
    state.hoverButtonId = null;
    state.hoveredCard = null;
    state.hoveredDieIdx = (state.mode === 'PLAYING' && !state.modal)
      ? findHoveredDieIndex(state, state.mouseX, state.mouseY)
      : -1;

    const shakeX = state.shakeMag > 0.1 ? (Math.random() - 0.5) * 2 * state.shakeMag : 0;
    const shakeY = state.shakeMag > 0.1 ? (Math.random() - 0.5) * 2 * state.shakeMag : 0;

    ctx.save();
    ctx.translate(state.ox + shakeX * state.scale, state.oy + shakeY * state.scale);
    ctx.scale(state.scale, state.scale);

    if (state.mode === 'TITLE_MENU') {
      drawTitleScreen(ctx, state, uiCtx);
    } else {
      drawLeftHUD(ctx, state, uiCtx);
      drawModifierCardTray(ctx, state, uiCtx);
      if (state.mode === 'PLAYING' || state.mode === 'SCORING') {
        drawPlayArena(ctx, state, uiCtx);
      } else if (state.mode === 'CASH_OUT') {
        drawCashOutPanel(ctx, state, uiCtx);
      } else if (state.mode === 'SHOP') {
        drawShopArena(ctx, state, uiCtx);
      } else if (state.mode === 'VICTORY') {
        drawEndModal(ctx, state, true, uiCtx);
      } else if (state.mode === 'GAME_OVER') {
        drawEndModal(ctx, state, false, uiCtx);
      }
    }

    drawParticlesAndPopups(ctx, state);
    drawCardTooltip(ctx, state, uiCtx);
    drawDieInspectorTooltip(ctx, state, uiCtx);
    drawOverlayModal(ctx, state, uiCtx);

    drawHitFlash(ctx, state, LOGICAL_W, LOGICAL_H);

    ctx.restore();
    drawCRTOverlay(ctx, state);

    let cursor = 'default';
    if (state.drag && state.drag.active) cursor = 'grabbing';
    else if (state.hoverButtonId) cursor = 'pointer';
    else if (state.hoveredCard) cursor = state.hoveredCard.zone === 'active' ? 'grab' : 'pointer';
    else if (state.hoveredDieIdx !== -1) cursor = 'pointer';
    canvas.style.cursor = cursor;
  }

  // =========================================================================
  // 8. BOOTSTRAP & MAIN LOOP
  // =========================================================================
  initInputListeners(canvas, state, {
    LOGICAL_W,
    LOGICAL_H,
    startNewRun,
    toggleDieSelection,
    playSelectedHand,
    triggerReroll,
    clearSelectedDice,
    claimCashOut,
    rerollShop,
    startStage
  });
  initTitleBackdrop();

  let lastTime = performance.now();
  function frame(now) {
    const rawDt = (now - lastTime) / 1000;
    lastTime = now;
    const dt = Math.min(Math.max(rawDt, 0), 0.05);
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
